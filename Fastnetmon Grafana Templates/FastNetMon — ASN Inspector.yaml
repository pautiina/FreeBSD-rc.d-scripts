    panel-9:
      kind: Panel
      spec:
        id: 9
        title: Bandwidth — TO ASN / FROM ASN
        description: >-
          IN = dstAsn is selected ASN; OUT = srcAsn is selected ASN. Rates are
          reconstructed from sampled traffic.
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: grafana-clickhouse-datasource
                    version: v0
                    datasource:
                      name: fnm-clickhouse-datasource-uid
                    spec:
                      editorType: sql
                      format: 0
                      meta:
                        builderOptions:
                          database: fastnetmon
                          fields: []
                          filters: []
                          groupBy: []
                          limit: 0
                          mode: trend
                          orderBy: []
                      pluginVersion: 4.14.0
                      queryType: sql
                      rawSql: >-
                        WITH greatest(intDiv($__interval_ms, 1000), 1) AS step

                        SELECT toDateTime(intDiv(toUInt32(packetDateTime), step)
                        * step) AS time,
                               sumIf(length * sampleRatio * 8, dstAsn = $asn) / step AS `To ASN`,
                               sumIf(length * sampleRatio * 8, srcAsn = $asn) / step AS `From ASN`
                        FROM fastnetmon.traffic

                        WHERE packetDate >= toDate($__fromTime) AND packetDate
                        <= toDate($__toTime) AND $__timeFilter(packetDateTime)
                        AND ipProtocolVersion =
                        if('$protocol_version'='asn_metrics_ipv4',4,6) AND
                        (srcAsn = $asn OR dstAsn = $asn) AND (
                          '${protocol}' = 'total'
                          OR ('${protocol}' = 'tcp' AND protocol = 6)
                          OR ('${protocol}' = 'udp' AND protocol = 17)
                          OR ('${protocol}' = 'icmp' AND protocol IN (1,58))
                          OR ('${protocol}' = 'fragmented' AND ipFragmented != 0)
                          OR ('${protocol}' = 'tcp_syn' AND protocol = 6 AND bitAnd(flags, 2) != 0)
                        )

                        GROUP BY time

                        ORDER BY time
                  refId: A
                  hidden: false
            transformations: []
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: timeseries
          version: 12.4.2
          spec:
            options:
              legend:
                calcs:
                  - lastNotNull
                  - max
                  - mean
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                hideZeros: false
                mode: multi
                sort: desc
            fieldConfig:
              defaults:
                unit: bps
                thresholds:
                  mode: absolute
                  steps:
                    - value: null
                      color: green
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ''
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 8
                  gradientMode: none
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 1
                  pointSize: 4
                  scaleDistribution:
                    type: linear
                  showPoints: never
                  showValues: false
                  spanNulls: true
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: 'off'
              overrides: []
