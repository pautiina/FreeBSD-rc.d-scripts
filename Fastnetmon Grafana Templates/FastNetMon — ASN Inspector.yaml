        title: OUT / FROM ASN bandwidth
        description: >-
          30-second average ending at dashboard To time. OUT means traffic whose
          source ASN is the selected ASN. Sampling is restored with sampleRatio.
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: grafana-clickhouse-datasource
                    version: v0
                    datasource:
                      name: fnm-clickhouse-datasource-uid
                    spec:
                      editorType: sql
                      format: 1
