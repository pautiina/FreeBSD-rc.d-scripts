                        builderOptions:
                          database: fastnetmon
                          fields: []
                          filters: []
                          groupBy: []
                          limit: 0
                          mode: trend
                          orderBy: []
                      pluginVersion: 4.14.0
                      queryType: sql
                      rawSql: >-
                        SELECT sum(length * sampleRatio * 8) / 30.0 AS value
                        FROM fastnetmon.traffic WHERE packetDate >=
                        toDate($__toTime - INTERVAL 30 SECOND) AND packetDate <=
                        toDate($__toTime) AND packetDateTime > $__toTime -
                        INTERVAL 30 SECOND AND packetDateTime <= $__toTime AND
                        ipProtocolVersion =
                        if('$protocol_version'='asn_metrics_ipv4',4,6) AND
                        srcAsn = $asn AND (
                          '${protocol}' = 'total'
                          OR ('${protocol}' = 'tcp' AND protocol = 6)
                          OR ('${protocol}' = 'udp' AND protocol = 17)
                          OR ('${protocol}' = 'icmp' AND protocol IN (1,58))
                          OR ('${protocol}' = 'fragmented' AND ipFragmented != 0)
                          OR ('${protocol}' = 'tcp_syn' AND protocol = 6 AND bitAnd(flags, 2) != 0)
                        )
