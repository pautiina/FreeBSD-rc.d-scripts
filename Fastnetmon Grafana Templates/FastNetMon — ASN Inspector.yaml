            matchAny: false
            tags: []
            type: dashboard
        enable: true
        hide: true
        iconColor: rgba(0, 211, 255, 1)
        name: Annotations & Alerts
        builtIn: true
        legacyOptions:
          type: dashboard
    - kind: AnnotationQuery
      spec:
        query:
          kind: DataQuery
          group: grafana-clickhouse-datasource
          version: v0
          datasource:
            name: fnm-clickhouse-datasource-uid
          spec:
            builderOptions:
              database: fastnetmon
              fields:
                - title
                - text
                - eventDateTime
              filters:
                - condition: AND
                  filterType: custom
                  key: eventDateTime
                  operator: WITH IN DASHBOARD TIME RANGE
                  restrictToFields:
                    - label: eventDateTime
                      name: eventDateTime
                      picklistValues: []
                      type: DateTime
                  type: datetime
              limit: 100
              mode: list
              orderBy: []
              table: attack_events
            queryType: builder
            rawSql: >-
              SELECT "title", "text", "eventDateTime" FROM
              "fastnetmon"."attack_events" WHERE   ( eventDateTime  >=
              $__fromTime AND eventDateTime <= $__toTime ) LIMIT 100
            refId: Anno
        enable: false
        hide: false
        iconColor: red
        name: FastNetMon attacks
        mappings:
          text:
            source: field
            value: text
          time:
            source: field
            value: eventDateTime
          title:
            source: field
            value: title
  cursorSync: 'Off'
  description: >-
    ASN traffic inspector based on sampled FastNetMon traffic DB. v3 adds
    exporter input→output interface path analysis for traffic TO and FROM the
    selected ASN.
  editable: true
  elements:
    panel-1:
      kind: Panel
      spec:
        id: 1
        title: IN / TO ASN bandwidth
        description: >-
          30-second average ending at dashboard To time. IN means traffic whose
          destination ASN is the selected ASN. Sampling is restored with
          sampleRatio.
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: grafana-clickhouse-datasource
                    version: v0
                    datasource:
                      name: fnm-clickhouse-datasource-uid
                    spec:
                      editorType: sql
                      format: 1
                      meta:
                        builderOptions:
                          database: fastnetmon
                          fields: []
                          filters: []
                          groupBy: []
                          limit: 0
                          mode: trend
                          orderBy: []
                      pluginVersion: 4.14.0
                      queryType: sql
                      rawSql: >-
                        SELECT sum(length * sampleRatio * 8) / 30.0 AS value
                        FROM fastnetmon.traffic WHERE packetDate >=
                        toDate($__toTime - INTERVAL 30 SECOND) AND packetDate <=
                        toDate($__toTime) AND packetDateTime > $__toTime -
                        INTERVAL 30 SECOND AND packetDateTime <= $__toTime AND
                        ipProtocolVersion =
                        if('$protocol_version'='asn_metrics_ipv4',4,6) AND
                        dstAsn = $asn AND (
                          '${protocol}' = 'total'
                          OR ('${protocol}' = 'tcp' AND protocol = 6)
                          OR ('${protocol}' = 'udp' AND protocol = 17)
                          OR ('${protocol}' = 'icmp' AND protocol IN (1,58))
                          OR ('${protocol}' = 'fragmented' AND ipFragmented != 0)
                          OR ('${protocol}' = 'tcp_syn' AND protocol = 6 AND bitAnd(flags, 2) != 0)
                        )
                  refId: A
                  hidden: false
            transformations: []
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: stat
          version: 12.4.2
          spec:
            options:
              colorMode: value
              graphMode: area
              justifyMode: auto
              orientation: auto
              percentChangeColorMode: standard
              reduceOptions:
                calcs:
                  - lastNotNull
                fields: ''
                values: false
              showPercentChange: false
              textMode: auto
              wideLayout: true
            fieldConfig:
              defaults:
                unit: bps
                thresholds:
                  mode: absolute
                  steps:
                    - value: null
                      color: green
                color:
                  mode: thresholds
              overrides: []
    panel-10:
      kind: Panel
      spec:
        id: 10
        title: Packet rate — TO ASN / FROM ASN
        description: Packet rate reconstructed from sampled traffic.
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: grafana-clickhouse-datasource
                    version: v0
                    datasource:
                      name: fnm-clickhouse-datasource-uid
                    spec:
                      editorType: sql
                      format: 0
                      meta:
                        builderOptions:
                          database: fastnetmon
                          fields: []
                          filters: []
                          groupBy: []
                          limit: 0
                          mode: trend
                          orderBy: []
                      pluginVersion: 4.14.0
                      queryType: sql
                      rawSql: >-
                        WITH greatest(intDiv($__interval_ms, 1000), 1) AS step

                        SELECT toDateTime(intDiv(toUInt32(packetDateTime), step)
                        * step) AS time,
                               sumIf(numberOfPackets * sampleRatio, dstAsn = $asn) / step AS `To ASN`,
                               sumIf(numberOfPackets * sampleRatio, srcAsn = $asn) / step AS `From ASN`
                        FROM fastnetmon.traffic

                        WHERE packetDate >= toDate($__fromTime) AND packetDate
                        <= toDate($__toTime) AND $__timeFilter(packetDateTime)
                        AND ipProtocolVersion =
                        if('$protocol_version'='asn_metrics_ipv4',4,6) AND
                        (srcAsn = $asn OR dstAsn = $asn) AND (
                          '${protocol}' = 'total'
                          OR ('${protocol}' = 'tcp' AND protocol = 6)
                          OR ('${protocol}' = 'udp' AND protocol = 17)
                          OR ('${protocol}' = 'icmp' AND protocol IN (1,58))
                          OR ('${protocol}' = 'fragmented' AND ipFragmented != 0)
                          OR ('${protocol}' = 'tcp_syn' AND protocol = 6 AND bitAnd(flags, 2) != 0)
                        )

                        GROUP BY time

                        ORDER BY time
                  refId: A
                  hidden: false
            transformations: []
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: timeseries
          version: 12.4.2
          spec:
            options:
              legend:
                calcs:
                  - lastNotNull
                  - max
                  - mean
                displayMode: table
                placement: bottom
