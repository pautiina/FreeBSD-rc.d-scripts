spec:
  annotations: []
  cursorSync: 'Off'
  description: >-
    Traffic observed on the selected outputInterface. Shows both destination and
    source ASN perspectives using sampled FastNetMon traffic data.
  editable: true
  elements:
    panel-1:
      kind: Panel
      spec:
        id: 1
        title: Destination ASNs — bandwidth (traffic leaving interface)
        description: >-
          Top 10 destination ASNs for flows observed on the selected output
          interface.
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: grafana-clickhouse-datasource
                    version: v0
                    datasource:
                      name: fnm-clickhouse-datasource-uid
                    spec:
                      editorType: sql
                      format: 0
                      meta:
                        builderOptions:
                          database: fastnetmon
                          fields: []
                          filters: []
                          groupBy: []
                          limit: 0
                          mode: trend
                          orderBy: []
                      pluginVersion: 4.14.0
                      queryType: timeseries
                      rawSql: |-
                        SELECT
                            packetDateTime AS time,
                            concat(dictGetOrDefault('fastnetmon.asn_information', 'asn_name', toUInt64(dstAsn), 'Unknown'), ' AS', toString(dstAsn)) AS ASN,
                            sum(length * sampleRatio * 8) AS bps
                        FROM fastnetmon.traffic
                        WHERE $__timeFilter(packetDateTime)
                          AND ('$interface' = '0' OR outputInterface = toUInt32('$interface'))
                          AND dstAsn IN (
                              SELECT dstAsn
                              FROM fastnetmon.traffic
                              WHERE $__timeFilter(packetDateTime)
                                AND ('$interface' = '0' OR outputInterface = toUInt32('$interface'))
                              GROUP BY dstAsn
                              ORDER BY sum(length * sampleRatio * 8) DESC
                              LIMIT 10
                          )
                        GROUP BY time, dstAsn
                        ORDER BY time
                  refId: A
                  hidden: false
            transformations: []
            queryOptions: {}
