                         WHERE $__timeFilter(metricDateTime) AND ('${router}' = 'all' OR device_ip = '${router}')
                         GROUP BY device_ip, interface_id
                         ORDER BY avg(bits_incoming + bits_outgoing) DESC
                         LIMIT 10
