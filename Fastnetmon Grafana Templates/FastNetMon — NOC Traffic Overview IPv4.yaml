                          filters: []
                          groupBy: []
                          limit: 0
                          mode: trend
                          orderBy: []
                      pluginVersion: 4.14.0
                      queryType: table
                      rawSql: |-
                        SELECT host AS Host,
                         max(bits_incoming) AS `Peak IN bps`, max(bits_outgoing) AS `Peak OUT bps`,
                         avg(bits_incoming) AS `Avg IN bps`, avg(bits_outgoing) AS `Avg OUT bps`
                        FROM fastnetmon.host_metrics_ipv4_top
                        WHERE $__timeFilter(metricDateTime)
                        GROUP BY host
                        ORDER BY greatest(`Peak IN bps`, `Peak OUT bps`) DESC
                        LIMIT 20
                  refId: A
                  hidden: false
            transformations: []
            queryOptions: {}
