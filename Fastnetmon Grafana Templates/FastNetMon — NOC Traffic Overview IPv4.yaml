                         toStartOfInterval(metricDateTime, INTERVAL 5 SECOND) AS time,
                         if(interface_name = '', concat(device_ip, ' / if', toString(interface_id)), concat(device_ip, ' / ', interface_name, ' (if', toString(interface_id), ')')) AS Interface,
                         avg(bits_incoming + bits_outgoing) AS `Bandwidth`
                        FROM fastnetmon.interface_metrics

                        WHERE $__timeFilter(metricDateTime) AND ('${router}' =
                        'all' OR device_ip = '${router}')
                          AND (device_ip, interface_id) IN top_interfaces
                        GROUP BY time, device_ip, interface_id, interface_name

