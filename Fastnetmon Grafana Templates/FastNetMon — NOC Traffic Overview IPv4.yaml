                        builderOptions:
                          database: fastnetmon
                          fields: []
                          filters: []
                          groupBy: []
                          limit: 0
                          mode: trend
                          orderBy: []
                      pluginVersion: 4.14.0
                      queryType: table
                      rawSql: >-
                        SELECT
                         if(interface_name = '', concat(device_ip, ' / if', toString(interface_id)), concat(device_ip, ' / ', interface_name, ' (if', toString(interface_id), ')')) AS Interface,
                         argMax(bits_incoming, metricDateTime) AS `IN bps`,
                         argMax(bits_outgoing, metricDateTime) AS `OUT bps`,
                         argMax(packets_incoming, metricDateTime) AS `IN pps`,
                         argMax(packets_outgoing, metricDateTime) AS `OUT pps`,
                         argMax(flows_incoming, metricDateTime) AS `IN flows/s`,
                         argMax(flows_outgoing, metricDateTime) AS `OUT flows/s`
                        FROM fastnetmon.interface_metrics

                        WHERE metricDateTime >= now() - INTERVAL 30 SECOND AND
                        ('${router}' = 'all' OR device_ip = '${router}')

                        GROUP BY device_ip, interface_id, interface_name

                        ORDER BY greatest(`IN bps`, `OUT bps`) DESC

                        LIMIT 30
