        description: >-
          Latest FastNetMon interface counters. If interface_name is
          unavailable, the label is router IP / ifIndex.
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: grafana-clickhouse-datasource
                    version: v0
                    datasource:
                      name: fnm-clickhouse-datasource-uid
