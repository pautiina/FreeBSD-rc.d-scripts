    panel-9:
      kind: Panel
      spec:
        id: 9
        title: Traffic DB sample selected
        description: >-
          Selected traffic DB samples as a percentage of seen packets over the
          health delta window.
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: grafana-clickhouse-datasource
                    version: v0
                    datasource:
                      name: fnm-clickhouse-datasource-uid
                    spec:
                      editorType: sql
                      format: 1
                      meta:
                        builderOptions:
                          database: fastnetmon
                          fields: []
                          filters: []
                          groupBy: []
                          limit: 0
                          mode: trend
                          orderBy: []
                      pluginVersion: 4.14.0
                      queryType: table
                      rawSql: |-
                        WITH deltas AS (
                          SELECT
                            name,
                            if(
                              last_value >= first_value,
                              toInt128(last_value) - toInt128(first_value),
                              toInt128(last_value)
                            ) AS delta
                          FROM (
                            SELECT
                              name,
                              argMin(value, metricDateTime) AS first_value,
                              argMax(value, metricDateTime) AS last_value
                            FROM fastnetmon.system_metrics
                            WHERE metricDateTime >= now() - toIntervalSecond($delta_seconds)
                              AND name IN ('traffic_db_sampler_seen_packets','traffic_db_sampler_selected_packets')
                            GROUP BY name
                          )
                        )
                        SELECT
                          if(
                            sumIf(delta, name = 'traffic_db_sampler_seen_packets') = 0,
                            0.0,
                            100.0
                              * toFloat64(sumIf(delta, name = 'traffic_db_sampler_selected_packets'))
                              / toFloat64(sumIf(delta, name = 'traffic_db_sampler_seen_packets'))
                          ) AS value
                        FROM deltas
                  refId: A
                  hidden: false
            transformations: []
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: stat
          version: 12.4.2
          spec:
            options:
              colorMode: value
              graphMode: none
              justifyMode: auto
              orientation: auto
              reduceOptions:
                calcs:
                  - lastNotNull
                fields: ''
                values: false
              showPercentChange: false
              textMode: auto
              wideLayout: true
            fieldConfig:
              defaults:
                unit: percent
                decimals: 3
                thresholds:
                  mode: absolute
                  steps:
                    - value: null
                      color: green
                color:
                  mode: thresholds
              overrides: []
