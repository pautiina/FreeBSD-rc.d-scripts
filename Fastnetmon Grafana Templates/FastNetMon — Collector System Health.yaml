    panel-27:
      kind: Panel
      spec:
        id: 27
        title: Calculation-delay counters per second
        description: Internal FastNetMon calculation scheduling counters.
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: grafana-clickhouse-datasource
                    version: v0
                    datasource:
                      name: fnm-clickhouse-datasource-uid
                    spec:
                      editorType: sql
                      format: 0
                      meta:
                        builderOptions:
                          database: fastnetmon
                          fields: []
                          filters: []
                          groupBy: []
                          limit: 0
                          mode: trend
                          orderBy: []
                      pluginVersion: 4.14.0
                      queryType: timeseries
                      rawSql: |-
                        WITH greatest(intDiv($__interval_ms, 1000), 1) AS step
                        SELECT
                          time,
                          multiIf(name='all_traffic_calculation_too_slow', 'Calculation too slow', name='all_traffic_calculation_delay_longer', 'Delay longer', name='all_traffic_calculation_delay_shorter', 'Delay shorter', name='all_traffic_calculation_delay_negative', 'Delay negative', name) AS metric,
                          if(
                             current_value >= previous_value,
                             toFloat64(toInt128(current_value) - toInt128(previous_value)) / step,
                             toFloat64(current_value) / step
                          ) AS rate
                        FROM (
                          SELECT
                            time,
                            name,
                            current_value,
                            lagInFrame(current_value, 1, current_value)
                              OVER (PARTITION BY name ORDER BY time
                                    ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS previous_value
                          FROM (
                            SELECT
                              toDateTime(intDiv(toUInt32(metricDateTime), step) * step) AS time,
                              name,
                              argMax(value, metricDateTime) AS current_value
                            FROM fastnetmon.system_metrics
                            WHERE $__timeFilter(metricDateTime)
                              AND name IN ('all_traffic_calculation_too_slow','all_traffic_calculation_delay_longer','all_traffic_calculation_delay_shorter','all_traffic_calculation_delay_negative')
                            GROUP BY time, name
                          )
                        )
                        ORDER BY time, metric
                  refId: A
                  hidden: false
            transformations: []
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: timeseries
          version: 12.4.2
          spec:
            options:
              legend:
                calcs:
                  - lastNotNull
                  - max
                  - mean
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                hideZeros: false
