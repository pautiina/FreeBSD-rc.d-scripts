                          groupBy: []
                          limit: 0
                          mode: trend
                          orderBy: []
                      pluginVersion: 4.14.0
                      queryType: table
                      rawSql: >-
                        SELECT sum(if(last_value >= first_value,
                        toInt128(last_value) - toInt128(first_value),
                        toInt128(last_value))) AS value

                        FROM (
                          SELECT
                            name,
                            argMin(value, metricDateTime) AS first_value,
                            argMax(value, metricDateTime) AS last_value
                          FROM fastnetmon.system_metrics
                          WHERE metricDateTime >= now() - toIntervalSecond($delta_seconds)
                            AND name IN ('netflow_v9_broken_packets','netflow_v9_lite_header_parser_error','ipfix_inline_header_parser_error','netflow_ipfix_unknown_protocol_version','netflow_v9_too_large_field','ipfix_too_large_field')
                          GROUP BY name
                        )
                  refId: A
                  hidden: false
            transformations: []
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: stat
          version: 12.4.2
          spec:
