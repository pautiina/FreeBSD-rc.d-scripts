    panel-29:
      kind: Panel
      spec:
        id: 29
        title: Problem counters changed in health window
        description: >-
          Only potentially problematic cumulative counters whose value increased
          in the selected health window.
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: grafana-clickhouse-datasource
                    version: v0
                    datasource:
                      name: fnm-clickhouse-datasource-uid
                    spec:
                      editorType: sql
                      format: 1
                      meta:
                        builderOptions:
                          database: fastnetmon
                          fields: []
                          filters: []
                          groupBy: []
                          limit: 0
                          mode: trend
                          orderBy: []
                      pluginVersion: 4.14.0
                      queryType: table
                      rawSql: |-
                        SELECT
                          name AS Metric,
                          metric_type AS Type,
                          if(
                            last_value >= first_value,
                            toInt128(last_value) - toInt128(first_value),
                            toInt128(last_value)
                          ) AS Delta,
                          first_value AS `First value`,
                          last_value AS `Last value`
                        FROM (
                          SELECT
                            name,
                            any(system_metrics.type) AS metric_type,
                            argMin(value, metricDateTime) AS first_value,
                            argMax(value, metricDateTime) AS last_value
                          FROM fastnetmon.system_metrics AS system_metrics
                          WHERE metricDateTime >= now() - toIntervalSecond($delta_seconds)
                            AND system_metrics.type = 'counter'
                            AND match(
                              lower(name),
                              '(error|errors|drop|drops|failed|broken|unknown|negative|too_slow|too_large|anomaly|ignored|rcvbuf|sndbuf|noports)'
                            )
                          GROUP BY name
                        )
                        WHERE Delta > 0
                        ORDER BY Delta DESC, Metric
                        LIMIT 100
                  refId: A
                  hidden: false
            transformations: []
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: table
          version: 12.4.2
          spec:
