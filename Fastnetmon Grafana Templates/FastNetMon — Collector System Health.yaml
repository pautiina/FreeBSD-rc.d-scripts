    panel-12:
      kind: Panel
      spec:
        id: 12
        title: Collector packets/s by protocol version
        description: >-
          Reset-aware per-second rate calculated from cumulative packet
          counters.
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: grafana-clickhouse-datasource
                    version: v0
                    datasource:
                      name: fnm-clickhouse-datasource-uid
                    spec:
                      editorType: sql
                      format: 0
                      meta:
                        builderOptions:
                          database: fastnetmon
                          fields: []
                          filters: []
                          groupBy: []
                          limit: 0
                          mode: trend
                          orderBy: []
                      pluginVersion: 4.14.0
                      queryType: timeseries
                      rawSql: |-
                        WITH greatest(intDiv($__interval_ms, 1000), 1) AS step
                        SELECT
                          time,
                          multiIf(name='netflow_v5_total_packets', 'NetFlow v5', name='netflow_v9_total_packets', 'NetFlow v9', name='ipfix_total_packets', 'IPFIX', name) AS metric,
                          if(
                             current_value >= previous_value,
                             toFloat64(toInt128(current_value) - toInt128(previous_value)) / step,
                             toFloat64(current_value) / step
                          ) AS rate
                        FROM (
                          SELECT
                            time,
                            name,
                            current_value,
                            lagInFrame(current_value, 1, current_value)
                              OVER (PARTITION BY name ORDER BY time
                                    ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS previous_value
                          FROM (
                            SELECT
                              toDateTime(intDiv(toUInt32(metricDateTime), step) * step) AS time,
                              name,
                              argMax(value, metricDateTime) AS current_value
                            FROM fastnetmon.system_metrics
                            WHERE $__timeFilter(metricDateTime)
                              AND name IN ('netflow_v5_total_packets','netflow_v9_total_packets','ipfix_total_packets')
                            GROUP BY time, name
                          )
                        )
                        ORDER BY time, metric
                  refId: A
                  hidden: false
            transformations: []
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: timeseries
          version: 12.4.2
          spec:
            options:
              legend:
                calcs:
                  - lastNotNull
                  - max
                  - mean
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                hideZeros: false
                mode: multi
                sort: desc
            fieldConfig:
