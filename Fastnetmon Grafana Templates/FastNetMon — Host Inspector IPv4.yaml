    panel-17:
      kind: Panel
      spec:
        id: 17
        title: Top source ASNs — IN
        description: >-
          Traffic DB is sampled; byte/packet columns are extrapolated with
          sampleRatio.
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: grafana-clickhouse-datasource
                    version: v0
                    datasource:
                      name: fnm-clickhouse-datasource-uid
                    spec:
                      editorType: sql
                      format: 1
                      meta:
                        builderOptions:
                          database: fastnetmon
                          fields: []
                          filters: []
                          groupBy: []
                          limit: 0
                          mode: trend
                          orderBy: []
                      pluginVersion: 4.14.0
                      queryType: table
                      rawSql: >-
                        SELECT
                        concat(dictGetOrDefault('fastnetmon.asn_information','asn_name',srcAsn,'Unknown'),'
                        AS',toString(srcAsn)) AS `Source ASN`,
                         sum(length*sampleRatio) AS `Estimated bytes`, sum(numberOfPackets*sampleRatio) AS `Estimated packets`, count() AS `Sampled records`
                        FROM fastnetmon.traffic WHERE
                        $__timeFilter(packetDateTime) AND
                        dstIp=IPv4StringToNum('$host')

                        GROUP BY srcAsn ORDER BY `Estimated bytes` DESC LIMIT 20
                  refId: A
                  hidden: false
            transformations: []
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: table
          version: 12.4.2
          spec:
            options:
              cellHeight: sm
              footer:
                countRows: false
                fields: ''
                reducer:
                  - sum
                show: false
              showHeader: true
              sortBy: []
            fieldConfig:
              defaults:
                thresholds:
                  mode: absolute
                  steps:
                    - value: null
                      color: green
                color:
                  mode: thresholds
                custom:
                  align: auto
                  cellOptions:
                    type: auto
                  inspect: false
              overrides:
                - matcher:
                    id: byName
                    options: Estimated bytes
                  properties:
                    - id: unit
                      value: bytes
                - matcher:
                    id: byName
                    options: Estimated packets
                  properties:
                    - id: unit
                      value: short
                - matcher:
                    id: byName
                    options: Sampled records
                  properties:
                    - id: unit
                      value: short
                - matcher:
                    id: byName
                    options: Destination port
                  properties:
                    - id: unit
                      value: none
                - matcher:
                    id: byName
                    options: Input interface
                  properties:
                    - id: unit
                      value: none
                - matcher:
                    id: byName
                    options: ASN
                  properties:
                    - id: unit
