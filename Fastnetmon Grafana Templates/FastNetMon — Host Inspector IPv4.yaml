    panel-31:
      kind: Panel
      spec:
        id: 31
        title: Interface paths — OUT packet rate
        description: >-
          Top 12 exporter input→output paths for traffic FROM this host.
          Sampled/reconstructed and stacked.
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: grafana-clickhouse-datasource
                    version: v0
                    datasource:
                      name: fnm-clickhouse-datasource-uid
                    spec:
                      editorType: sql
                      format: 0
                      meta:
                        builderOptions:
                          database: fastnetmon
                          fields: []
                          filters: []
                          groupBy: []
                          limit: 0
                          mode: trend
                          orderBy: []
                      pluginVersion: 4.14.0
                      queryType: timeseries
                      rawSql: |-
                        WITH greatest(intDiv($__interval_ms,1000),1) AS step
                        SELECT
                          toDateTime(intDiv(toUInt32(packetDateTime),step)*step) AS time,
                          concat(IPv4NumToString(agentIpAddress), ': if', toString(inputInterface), ' → if', toString(outputInterface)) AS path,
                          sum(numberOfPackets*sampleRatio) / step AS value
                        FROM fastnetmon.traffic
                        WHERE packetDate >= toDate($__fromTime)
                          AND packetDate <= toDate($__toTime)
                          AND $__timeFilter(packetDateTime)
                          AND srcIp=IPv4StringToNum('$host')
                          AND tuple(agentIpAddress,inputInterface,outputInterface) IN (
                            SELECT tuple(agentIpAddress,inputInterface,outputInterface)
                            FROM fastnetmon.traffic
                            WHERE packetDate >= toDate($__fromTime)
                              AND packetDate <= toDate($__toTime)
                              AND $__timeFilter(packetDateTime)
                              AND srcIp=IPv4StringToNum('$host')
                            GROUP BY agentIpAddress,inputInterface,outputInterface
                            ORDER BY sum(numberOfPackets*sampleRatio) DESC
                            LIMIT 12
                          )
                        GROUP BY time,path
                        ORDER BY time,path
                  refId: A
                  hidden: false
            transformations: []
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: timeseries
          version: 12.4.2
          spec:
            options:
              legend:
                calcs:
                  - lastNotNull
                  - max
                  - mean
                displayMode: table
                placement: bottom
                showLegend: true
              tooltip:
                hideZeros: false
                mode: multi
                sort: desc
            fieldConfig:
              defaults:
                unit: pps
                thresholds:
                  mode: absolute
                  steps:
                    - value: null
                      color: green
                color:
                  mode: palette-classic
                custom:
                  axisBorderShow: false
                  axisCenteredZero: false
                  axisColorMode: text
                  axisLabel: ''
                  axisPlacement: auto
                  barAlignment: 0
                  barWidthFactor: 0.6
                  drawStyle: line
                  fillOpacity: 18
                  gradientMode: none
                  hideFrom:
                    legend: false
                    tooltip: false
                    viz: false
                  insertNulls: false
                  lineInterpolation: linear
                  lineWidth: 1
                  pointSize: 4
                  scaleDistribution:
                    type: linear
                  showPoints: never
                  showValues: false
                  spanNulls: true
                  stacking:
                    group: A
                    mode: normal
                  thresholdsStyle:
                    mode: 'off'
              overrides: []
