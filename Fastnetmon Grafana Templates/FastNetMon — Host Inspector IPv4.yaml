              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: grafana-clickhouse-datasource
                    version: v0
                    datasource:
                      name: fnm-clickhouse-datasource-uid
                    spec:
                      editorType: sql
                      format: 0
                      meta:
                        builderOptions:
                          database: fastnetmon
                          fields: []
                          filters: []
                          groupBy: []
                          limit: 0
                          mode: trend
                          orderBy: []
                      pluginVersion: 4.14.0
                      queryType: timeseries
                      rawSql: >-
                        SELECT toDateTime(intDiv(toUInt32(metricDateTime),
                        greatest(intDiv($__interval_ms,1000),1)) *
                        greatest(intDiv($__interval_ms,1000),1)) AS time,
                        avg(bits_incoming) AS Incoming, avg(bits_outgoing) AS
                        Outgoing

                        FROM fastnetmon.host_metrics WHERE
                        $__timeFilter(metricDateTime) AND host='$host' GROUP BY
                        time ORDER BY time
                  refId: A
                  hidden: false
            transformations: []
            queryOptions: {}
