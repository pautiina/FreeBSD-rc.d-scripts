    panel-27:
      kind: Panel
      spec:
        id: 27
        title: Exporter / output interface — OUT
        description: >-
          Traffic DB is sampled; byte/packet columns are extrapolated with
          sampleRatio.
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: grafana-clickhouse-datasource
                    version: v0
                    datasource:
                      name: fnm-clickhouse-datasource-uid
                    spec:
                      editorType: sql
                      format: 1
                      meta:
                        builderOptions:
                          database: fastnetmon
                          fields: []
                          filters: []
                          groupBy: []
                          limit: 0
                          mode: trend
                          orderBy: []
                      pluginVersion: 4.14.0
                      queryType: table
                      rawSql: >-
                        SELECT IPv4NumToString(agentIpAddress) AS Exporter,
                        outputInterface AS `Output interface`,
                         sum(length*sampleRatio) AS `Estimated bytes`, sum(numberOfPackets*sampleRatio) AS `Estimated packets`, count() AS `Sampled records`
                        FROM fastnetmon.traffic WHERE
                        $__timeFilter(packetDateTime) AND
                        srcIp=IPv4StringToNum('$host')

                        GROUP BY agentIpAddress,outputInterface ORDER BY
                        `Estimated bytes` DESC LIMIT 20
                  refId: A
                  hidden: false
            transformations: []
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: table
          version: 12.4.2
