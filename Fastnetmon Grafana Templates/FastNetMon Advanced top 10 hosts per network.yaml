                      formattedQuery: "<font color=\"darkcyan\">$columns</font>(<br />\_\_\_\_host c,<br />\_\_\_\_<font color=\"navajowhite\">sum</font>(bits_incoming) <font color=\"navajowhite\">length</font>)<br /><font color=\"darkorange\">FROM</font> <font color=\"darkcyan\">$table</font><br /><font color=\"darkorange\">WHERE</font> host <font color=\"darkorange\">in</font> (<br />\_\_\_\_<font color=\"darkorange\">SELECT</font> host<br />\_\_\_\_<font color=\"darkorange\">FROM</font><br />(<br />\_\_\_\_\_\_\_\_<font color=\"darkorange\">SELECT</font><br />\_\_\_\_\_\_\_\_\_\_\_\_host,<br />\_\_\_\_\_\_\_\_\_\_\_\_<font color=\"navajowhite\">sum</font>(bits_incoming) <font color=\"darkorange\">as</font> <font color=\"navajowhite\">length</font><br />\_\_\_\_\_\_\_\_<font color=\"darkorange\">FROM</font> <font color=\"darkcyan\">$table</font><br />\_\_\_\_\_\_\_\_<font color=\"darkorange\">GROUP BY</font> host<br />\_\_\_\_\_\_\_\_<font color=\"darkorange\">ORDER BY</font> <font color=\"navajowhite\">length</font> <font color=\"darkorange\">DESC</font><br />\_\_\_\_\_\_\_\_<font color=\"darkorange\">LIMIT</font> <font color=\"cornflowerblue\">10</font><br />))"
                      groupBy:
                        - params:
                            - $__interval
                          type: time
                        - params:
                            - 'null'
                          type: fill
                      interval: 1s
                      intervalFactor: 1
                      orderByTime: ASC
                      policy: default
                      query: |-
                        $columns(
                            host c,
                            sum(bits_incoming) length)
                        FROM $table
                        WHERE host in (
                            SELECT host
                            FROM
                        (
                                SELECT
                                    host,
                                    sum(bits_incoming) as length
                                FROM $table
                                WHERE $timeFilter and isIPAddressInRange(host, '$Network')
                                GROUP BY host
                                ORDER BY length DESC
                                LIMIT 7
                        ))
                      rawQuery: >-
                        SELECT t, groupArray((c, length)) AS groupArr FROM (
                        SELECT (intDiv(toUInt32(metricDateTime), 1) * 1) * 1000
                        AS t, host c, sum(bits_incoming) length FROM
                        fastnetmon.host_metrics WHERE metricDate >=
                        toDate(1648080103) AND metricDateTime >=
                        toDateTime(1648080103) AND host in (     SELECT host    
                        FROM (         SELECT             host,            
                        sum(bits_incoming) as length         FROM
                        fastnetmon.host_metrics         WHERE metricDate >=
                        toDate(1648080103) AND metricDateTime >=
                        toDateTime(1648080103) and isIPAddressInRange(host,
                        '103.100.92.0/24')         GROUP BY host         ORDER
                        BY length DESC         LIMIT 7 )) GROUP BY t, c ORDER BY
                        t, c) GROUP BY t ORDER BY t
                      resultFormat: time_series
                      round: 0s
                      select:
                        - - params:
                              - value
                            type: field
                          - params: []
                            type: mean
