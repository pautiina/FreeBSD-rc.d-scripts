                  spanNulls: true
                  stacking:
                    group: A
                    mode: none
                  thresholdsStyle:
                    mode: 'off'
              overrides: []
    panel-8:
      kind: Panel
      spec:
        id: 8
        title: Average packet size — outgoing
        description: Packet size for hosts ranked by selected outgoing bandwidth.
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: grafana-clickhouse-datasource
                    version: v0
                    datasource:
                      name: fnm-clickhouse-datasource-uid
                    spec:
                      editorType: sql
                      format: 0
                      meta:
                        builderOptions:
                          database: fastnetmon
                          fields: []
                          filters: []
                          groupBy: []
                          limit: 0
                          mode: trend
                          orderBy: []
                      pluginVersion: 4.14.0
                      queryType: timeseries
                      rawSql: >-
                        SELECT $__timeInterval(metricDateTime) AS time, host,
                        avg(if(multiIf('${protocol}'='total',packets_outgoing,'${protocol}'='tcp',tcp_packets_outgoing,'${protocol}'='udp',udp_packets_outgoing,'${protocol}'='icmp',icmp_packets_outgoing,'${protocol}'='fragmented',fragmented_packets_outgoing,'${protocol}'='tcp_syn',tcp_syn_packets_outgoing,0)>0,multiIf('${protocol}'='total',bits_outgoing,'${protocol}'='tcp',tcp_bits_outgoing,'${protocol}'='udp',udp_bits_outgoing,'${protocol}'='icmp',icmp_bits_outgoing,'${protocol}'='fragmented',fragmented_bits_outgoing,'${protocol}'='tcp_syn',tcp_syn_bits_outgoing,0)/multiIf('${protocol}'='total',packets_outgoing,'${protocol}'='tcp',tcp_packets_outgoing,'${protocol}'='udp',udp_packets_outgoing,'${protocol}'='icmp',icmp_packets_outgoing,'${protocol}'='fragmented',fragmented_packets_outgoing,'${protocol}'='tcp_syn',tcp_syn_packets_outgoing,0)/8.0,0.0))
                        AS " "

                        FROM fastnetmon.$protocol_version

                        WHERE host IN (
                          SELECT host FROM (
                            SELECT host, sum(multiIf('${protocol}'='total',bits_outgoing,'${protocol}'='tcp',tcp_bits_outgoing,'${protocol}'='udp',udp_bits_outgoing,'${protocol}'='icmp',icmp_bits_outgoing,'${protocol}'='fragmented',fragmented_bits_outgoing,'${protocol}'='tcp_syn',tcp_syn_bits_outgoing,0)) AS rank_value
                            FROM fastnetmon.$protocol_version
                            WHERE $__timeFilter(metricDateTime)
                            GROUP BY host ORDER BY rank_value DESC LIMIT 10
                          )
                        ) AND $__timeFilter(metricDateTime)

                        GROUP BY host, time ORDER BY time
                  refId: A
                  hidden: false
            transformations: []
            queryOptions: {}
        vizConfig:
          kind: VizConfig
          group: timeseries
          version: 12.4.2
          spec:
            options:
              legend:
                calcs:
                  - lastNotNull
                  - max
                  - mean
