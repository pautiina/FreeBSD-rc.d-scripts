    panel-1:
      kind: Panel
      spec:
        id: 1
        title: Incoming bandwidth
        description: Top 10 hosts by selected incoming traffic type.
        links: []
        data:
          kind: QueryGroup
          spec:
            queries:
              - kind: PanelQuery
                spec:
                  query:
                    kind: DataQuery
                    group: grafana-clickhouse-datasource
                    version: v0
                    datasource:
                      name: fnm-clickhouse-datasource-uid
                    spec:
                      editorType: sql
                      format: 0
                      meta:
                        builderOptions:
                          database: fastnetmon
                          fields: []
                          filters: []
                          groupBy: []
                          limit: 0
                          mode: trend
                          orderBy: []
                      pluginVersion: 4.14.0
                      queryType: timeseries
                      rawSql: >-
                        SELECT $__timeInterval(metricDateTime) AS time, host,
                        avg(multiIf('${protocol}'='total',bits_incoming,'${protocol}'='tcp',tcp_bits_incoming,'${protocol}'='udp',udp_bits_incoming,'${protocol}'='icmp',icmp_bits_incoming,'${protocol}'='fragmented',fragmented_bits_incoming,'${protocol}'='tcp_syn',tcp_syn_bits_incoming,0))
                        AS " "

                        FROM fastnetmon.$protocol_version

                        WHERE host IN (
                          SELECT host FROM (
                            SELECT host, sum(multiIf('${protocol}'='total',bits_incoming,'${protocol}'='tcp',tcp_bits_incoming,'${protocol}'='udp',udp_bits_incoming,'${protocol}'='icmp',icmp_bits_incoming,'${protocol}'='fragmented',fragmented_bits_incoming,'${protocol}'='tcp_syn',tcp_syn_bits_incoming,0)) AS rank_value
                            FROM fastnetmon.$protocol_version
                            WHERE $__timeFilter(metricDateTime)
                            GROUP BY host ORDER BY rank_value DESC LIMIT 10
                          )
                        ) AND $__timeFilter(metricDateTime)

                        GROUP BY host, time ORDER BY time
                  refId: A
                  hidden: false
