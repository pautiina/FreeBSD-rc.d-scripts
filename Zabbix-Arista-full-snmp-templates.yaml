                      if (Object.prototype.hasOwnProperty.call(e, '{#INGRESS_DROPPED}')) {
                          hasQueue[ifindex] = true;
                      }
                  });

                  var out = [];
                  Object.keys(hasQueue).sort(function(a,b){return Number(a)-Number(b);}).forEach(function(idx) {
                      var inf = ifs[idx];
                      if (!inf || !inf.name) return;
                      var label = inf.alias ? inf.name + ' (' + inf.alias + ')' : inf.name;
                      var q = Object.keys(egressQueues[idx] || {}).sort(function(a,b){return Number(a)-Number(b);});
                      var row = {
                          '{#IFINDEX}': idx,
                          '{#IFNAME}': inf.name,
                          '{#IFALIAS}': inf.alias,
                          '{#IFLABEL}': label,
                          '{#EGRESS_QUEUE_COUNT}': String(q.length)
                      };
                      for (var i=0; i<8; i++) {
                          row['{#EGQ' + (i+1) + '}'] = i < q.length ? q[i] : 'none' + (i+1);
                      }
                      out.push(row);
                  });
