                      var m = x.match(/-?\d+(?:\.\d+)?/);
                      if (!m) return false;
                      var n = Number(m[0]);
                      return n === -2147483648 || n === 2147483647 || n <= -999999999 || n >= 999999999;
                  }
                  function sensorPort(info) {
                      var m = s(info).match(/Ethernet\d+(?:\/\d+)?/i);
                      return m ? m[0] : '';
                  }
                  function modulePort(port) {
                      return s(port).replace(/\/\d+$/,'');
                  }
                  function laneNumber(port) {
                      var m = s(port).match(/\/(\d+)$/);
                      return m ? Number(m[1]) : 1;
                  }
                  function direction(info) {
                      var m = s(info).match(/\b(TX|RX)\b/i);
                      return m ? m[1].toUpperCase() : '';
                  }
                  function baseCandidates(port) {
                      var a = [port];
                      var m = port.match(/^(Ethernet\d+)\/(\d+)$/i);
                      if (m) {
                          if (Number(m[2]) !== 1) a.push(m[1] + '/1');
                          a.push(m[1]);
                      } else {
                          a.push(port + '/1');
                      }
                      return a;
                  }
                  function findIf(port) {
                      var a = baseCandidates(port);
                      for (var i = 0; i < a.length; i++) {
                          var k = a[i].toLowerCase();
                          if (ifByName[k]) return ifByName[k];
                      }
                      return {name: port, alias: ''};
                  }
                  function sensorObj(e, port) {
                      return {
                          index: s(e['{#SNMPINDEX}']),
                          scale: s(e['{#SENSOR_SCALE}']),
                          precision: s(e['{#SENSOR_PRECISION}']),
                          value: s(e['{#SENSOR_VALUE}']),
                          port: port
                      };
                  }
                  function sensorValueValid(v) {
                      var n = Number(s(v));
                      return isFinite(n)
                          && n !== -2147483648
                          && n !== 2147483647
                          && n > -999999999
                          && n < 999999999;
                  }
                  function mod(root) {
                      var k = root.toLowerCase();
                      if (!modules[k]) {
                          modules[k] = {
                              root: root,
                              rx: {}, tx: {}, bias: {},
                              biasCommon: null,
                              temps: [], volts: []
                          };
                      }
                      return modules[k];
                  }
                  function auxScore(root, port) {
                      if (port.toLowerCase() === root.toLowerCase()) return 0;
                      if (port.toLowerCase() === (root + '/1').toLowerCase()) return 1;
                      return 2;
                  }
                  function chooseAux(root, arr) {
                      if (!arr.length) return null;
                      arr.sort(function(a,b) {
                          var da=auxScore(root,a.port), db=auxScore(root,b.port);
                          if (da !== db) return da-db;
                          return a.port.localeCompare(b.port);
                      });
                      return arr[0];
                  }
                  function blankSensor(fallback) {
                      return {
                          index: fallback.index,
                          scale: fallback.scale,
                          precision: fallback.precision,
                          port: fallback.port
                      };
                  }

                  // IF-MIB rows are separate from ENTITY-SENSOR rows.
                  data.forEach(function(e) {
                      if (Object.prototype.hasOwnProperty.call(e, '{#IFNAME}')) {
                          var n = s(e['{#IFNAME}']);
                          if (n) ifByName[n.toLowerCase()] = {name:n, alias:s(e['{#IFALIAS}'])};
                      }
                  });

                  // Preserve existing per-power-sensor rows and simultaneously build a physical-module map.
                  data.forEach(function(e) {
                      if (!Object.prototype.hasOwnProperty.call(e, '{#SENSOR_TYPE}')) return;

                      var fields = ['{#SENSOR_TYPE}','{#SENSOR_SCALE}','{#SENSOR_PRECISION}','{#SENSOR_VALUE}','{#SENSOR_STATUS}','{#SENSOR_INFO}',
                                    '{#THRESHOLD_LO_WARN}','{#THRESHOLD_LO_CRIT}','{#THRESHOLD_HI_WARN}','{#THRESHOLD_HI_CRIT}'];
                      fields.forEach(function(f) {
                          if (!Object.prototype.hasOwnProperty.call(e,f) || e[f] === null) e[f] = '';
                      });

                      ['{#THRESHOLD_LO_WARN}','{#THRESHOLD_LO_CRIT}','{#THRESHOLD_HI_WARN}','{#THRESHOLD_HI_CRIT}'].forEach(function(f) {
                          if (badThreshold(e[f])) e[f] = '';
