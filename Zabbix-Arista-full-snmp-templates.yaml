zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: e0be0c9d34364d5d95ae2fc968fbf280
      name: 'Templates/Network devices'
  templates:
    - uuid: 26674f62500e4e79b9f470bbf962130d
      template: 'Arista SNMP'
      name: 'Arista SNMP'
      description: |
        Template Net Arista

        MIBs used:
        ENTITY-SENSORS-MIB
        ENTITY-STATE-MIB
        ENTITY-MIB

        Template tooling version used: 0.38

        P0/P1 revision:
        - ENTITY-SENSOR scale/precision-aware values
        - temperature/fan/PSU state checks
        - optics alias from IF-MIB dynamic index; device thresholds exposed as data
        - corrected RX power baseline-change trigger
        - ARISTA-IF-MIB err-disable and state-change monitoring
        - ARISTA-PHY-MIB FEC/PHY monitoring
        - ARISTA-QUEUE-MIB queue drops
        - ARISTA-HARDWARE-UTILIZATION-MIB resource utilization

        P0/P1 heterogeneous-hardware update:
        - ENTITY-SENSOR scale accepts numeric and enum-text representations with compatibility fallbacks.
        - Arista threshold sentinels +/-1000000000 and invalid optical zero values are discarded.
        - Transceiver aliases are resolved automatically; DOM sub-lanes fall back to the parent /1 interface.
        - Optional ARISTA-IF-MIB objects use not-supported preprocessing for older EOS.
        - ARISTA-PHY-MIB discovery is gated by the capabilities object to avoid creating unsupported items on older EOS.
        P0/P1 naming/event stability update:
        - ARISTA-QUEUE-MIB discovery is joined with IF-MIB ifName/ifAlias; user-facing queue items/problems no longer expose raw ifIndex.
        - Queue counters use one walk[] master item with dependent discoveries/items.
        - Counter-based P1 triggers use rolling windows and quiet-period recovery to avoid one-poll problem flapping.
        - Malformed legacy template tag {$IN / {#IFALIAS} removed; queue events get interface/description/queue/direction tags.

        P0/P1 heterogeneous update v2.6:
        - fixed duplicate transceiver alias keys (RX/TX LLD rows)
        - PHY/FEC moved to walk[] master + dependent capability-safe LLD/items
        - err-disabled moved to walk[] master + dependent capability-safe LLD/items
        - lost ENTITY-SENSOR resources are disabled immediately

        P0/P1 sensor/alias/value update v2.7:
        - sensors.get changed to one walk[] master containing ENTITY-SENSOR, Arista thresholds and IF-MIB names/aliases.
        - sensor LLD joins DOM sensor names to IF-MIB ifName/ifAlias and exposes {#IFLABEL}/{#SENSOR_INFO}.
        - transceiver, DOM temperature and DOM voltage names show interface description automatically (no manual alias macros).
        - Arista threshold underflow/overflow sentinels are treated as unsupported thresholds and are not discovered.
        - temperature/voltage/optical values get plausibility guards after scale/precision normalization.
        - threshold items are dependent on sensors.get, reducing SNMP polling and allowing immediate refresh after master Execute now.
        - legacy direct err-disabled items and transceiver alias-helper items are retired via LLD overrides.


        P0/P1 v2.8:
        - sensor display names use enriched {#SENSOR_INFO}, not synthetic {#SENSOR_LABEL}
        - optical preprocessing JS escape fixed
        - expected DOM no-light/sentinel values are discarded instead of becoming unsupported
        - transceiver names include IF-MIB alias when available
        - ENTITY/PSU names use entPhysicalDescr when entPhysicalName is empty


        P0/P1 v2.9:
        - added {$SFP_RX_NO_SIGNAL}=-33 dBm guard for RX optical triggers
        - low RX requires 3 minutes below {$SFP_WARNING} while remaining above no-signal floor
        - baseline-change trigger ignores module no-signal/noise region


        P0/P1 v2.10:
        - queue drop trigger sensitivity unchanged
        - queue drop recovery changed from 10m to 1h quiet period to prevent event flapping on bursty congestion


        P0/P1 v2.11:
        - added separate ingress/egress queue drop-rate item prototypes in pps using CHANGE_PER_SECOND
        - raw cumulative ARISTA-QUEUE-MIB counters and queue trigger logic from v2.10 are unchanged
        - drop-rate item names use {#IFLABEL} (ifName + ifAlias) for readable Latest data and simple graph titles


        P0/P1 v2.12:
        - queue alerts now use drop-rate (pps) items rather than cumulative raw counters
        - default queue rate warning is 0.1 pps averaged over 5m, with ifName context override support
        - queue recovery uses 30m max below 50% of threshold to reduce burst-related flapping
        - raw queue counters are retained only as technical sources with 1d history and no trends
        - egress packet type 0/1/2 is displayed as unicast/multicast/mixed in human-facing names

        P0/P1 v2.13:
        - Queue warning threshold: 0.5 pps average over 5 minutes.
        - Queue second-level threshold: 5 pps average over 5 minutes.
        - Warning recovery: <0.1 pps average over 15 minutes.
        - Second-level recovery: <1 pps average over 15 minutes.
        - Added egress/ingress queue drop-rate graph prototypes using {#IFLABEL}.
        - Added per-host template dashboard 'Arista Queue Monitoring'.
        - Raw queue counters remain technical source items only (1d history, no trends).

        P0/P1 v2.14:
        - Per-queue/type classic graph prototypes are NO_DISCOVER to reduce graph clutter; detailed per-queue rate items/triggers remain available.
        - Added one compact queue summary graph per physical interface with total Egress and total Ingress drop rate.
        - Queue summary values are calculated from the existing arista.queue.walk; no extra SNMP polling.
        - Added Arista optics interface discovery correlated from the existing sensors.get walk; no extra SNMP polling.
        - Added per-interface/lane graph prototype with RX and TX optical power on the left Y axis and DOM temperature on the right Y axis.
        - Dashboard renamed to 'Arista Monitoring' and now has Queues and Optics pages.
        - Optics page includes problems, combined per-interface optics graphs, RX overview, DOM temperature overview and DOM voltage overview.
        - All new user-visible interface names use {#IFLABEL} = EthernetX/Y(alias).

        P0/P1 v2.15:
        - Queue graphs in Monitoring > Graphs are grouped per interface instead of one graph per queue/type.
        - Grouped queue graph #1 shows up to eight discovered egress queues (packet types summed per queue) plus total ingress drop rate.
        - Grouped queue graph #2 shows egress unicast/multicast/mixed totals plus total ingress.
        - Detailed queue items and rate triggers remain unchanged.
        - Optics per-interface graph now includes RX, TX, DOM temperature, DOM voltage and laser bias current.
        - Voltage/bias are added only as graph data; missing module sensors are discarded without creating unsupported values.
        - Dedicated DOM voltage dashboard overview removed; electrical values are visible on the common optics graph.

        P0/P1 v2.16:
        - Merged Arista optics interface discovery into the existing Transceiver discovery.
        - One active Transceiver discovery now emits both legacy per-power-sensor rows and composite per-interface optical rows; LLD overrides keep the prototype sets separated.
        - Removed the separate arista.optics.interface.discovery rule from the template.
        - Composite RX/TX history is 90d; composite temperature/voltage/bias history is 7d.
        - Existing sensor.trans.value RX/TX history remains 90d; transceiver threshold history is reduced to 7d.
        - Voltage and laser bias graph sources are now DEPENDENT on sensors.get instead of direct per-module SNMP GETs, reducing SNMP polling load.

        P0/P1 v2.17:
        - One optics graph per physical transceiver module instead of one graph per optical lane.
        - Single-lane SFP/DWDM/WDM modules get a clean RX/TX/temperature/voltage/bias graph.
        - Multi-lane QSFP modules get one graph with RX/TX for up to four lanes plus module temperature/voltage and available per-lane bias currents.
        - Missing lanes and unsupported bias/voltage are discarded safely and do not break graphs.
        - All module graph items remain dependent on sensors.get; no additional SNMP polling.
        - Module RX/TX graph-source history is 90d; temperature/voltage/bias history is 7d.

        P0/P1 v2.17.1:
        - Fixed missing Egress mixed total drop rate on platforms that do not expose ARISTA-QUEUE-MIB mixedPacketType(2).
        - Mixed rate is calculated as Total Egress - Unicast - Multicast, so unsupported/missing type 2 is represented as 0 pps without fabricating a cumulative raw counter.
        - No LLD, SNMP polling, queue triggers, optics or graph structure changed.

        P0/P1 v2.17.2:
        - Expected DOM absence is no longer treated as a preprocessing error.
        - Missing RX/TX lanes, missing bias/voltage/temperature and no-light/sentinel optical values now return null from JavaScript preprocessing.
        - In Zabbix JavaScript preprocessing, null means discard the current value while keeping the item supported.
        - Plausibility failures (for example an impossible converted temperature or dBm value) still raise an error intentionally so real scaling/template faults remain visible.
        - No discovery rules, item keys, UUIDs, triggers, graphs, queue logic or SNMP polling were changed.

        P0/P1 v2.17.3:
        - Missing module RX/TX lanes and missing bias/temperature/voltage are disabled by LLD override instead of remaining permanently Unsupported.
        - Existing optical sensor rows that return Arista no-light/sentinel values are stored as -40 dBm, which keeps the item Supported and remains below {$SFP_RX_NO_SIGNAL}=-33, so the two optical RX alarms continue to ignore no-signal state.
        - Optional AUX sensors are treated as present only when their current ENTITY-SENSOR raw value is not an underflow/overflow sentinel.
        - No item keys, UUIDs, trigger expressions, graph definitions, queue logic or SNMP polling intervals were changed.
      templates:
        - name: 'EtherLike-MIB SNMP'
        - name: 'Generic SNMP'
        - name: 'HOST-RESOURCES-MIB SNMP'
        - name: 'Interfaces SNMP'
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 285ea014653346209498f0e7a6f5d2e4
          name: 'Get Arista error-disabled state and interface names'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.30065.3.15.1.1.1.10,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.31.1.1.1.18]'
          key: arista.if.errdisabled.walk
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Single SNMP walk for ARISTA-IF-MIB::aristaIfErrDisabledReason plus IF-MIB names. The dependent discovery creates items only where the Arista column is actually present.'
          tags:
            - tag: Application
              value: 'Zabbix raw items'
        - uuid: 233e32057d1448be986bd594da7d561c
          name: 'Get Arista PHY/FEC and interface names'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.30065.3.37.1.1.1,1.3.6.1.4.1.30065.3.37.1.1.2,1.3.6.1.4.1.30065.3.37.1.1.6,1.3.6.1.4.1.30065.3.37.1.1.7,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.31.1.1.1.18]'
          key: arista.phy.walk
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Single SNMP walk for ARISTA-PHY-MIB counters plus IF-MIB names. Used as the master item for capability-safe dependent PHY/FEC discovery and items.'
          tags:
            - tag: Application
              value: 'Zabbix raw items'
        - uuid: 26b5e83fcb5649bfb657a2a8d8de1928
          name: 'Get Arista queues and interface names'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.4.1.30065.3.6.1.2.1.6,1.3.6.1.4.1.30065.3.6.1.1.1.3,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.31.1.1.1.18]'
          key: arista.queue.walk
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Single SNMP walk used by ARISTA-QUEUE-MIB dependent discoveries/items. Includes egress/ingress queue drop counters plus IF-MIB ifName/ifAlias so queue events use human-readable interface names.'
          tags:
            - tag: Application
              value: 'Zabbix raw items'
        - uuid: 8954dfa9dc4445ad987f764e35c7db6e
          name: 'Get sensors and interface names'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.99.1.1.1.1,1.3.6.1.2.1.99.1.1.1.2,1.3.6.1.2.1.99.1.1.1.3,1.3.6.1.2.1.99.1.1.1.4,1.3.6.1.2.1.99.1.1.1.5,1.3.6.1.2.1.47.1.1.1.1.2,1.3.6.1.4.1.30065.3.12.1.1.1.1,1.3.6.1.4.1.30065.3.12.1.1.1.2,1.3.6.1.4.1.30065.3.12.1.1.1.3,1.3.6.1.4.1.30065.3.12.1.1.1.4,1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.31.1.1.1.18]'
          key: sensors.get
          delay: 15m
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Single SNMP walk containing ENTITY-SENSORS-MIB metadata/value/status, ARISTA-ENTITY-SENSOR-MIB thresholds and IF-MIB ifName/ifAlias. Used by sensor LLD and threshold dependent items.'
          tags:
            - tag: Application
              value: 'Zabbix raw items'
        - uuid: 74b669507e5a439cb73b7f527c229bf5
          name: 'Hardware model name'
          type: SNMP_AGENT
          snmp_oid: .1.3.6.1.2.1.47.1.1.1.1.13.1
          key: system.hw.model
          delay: 1h
          history: 90d
          value_type: CHAR
          trends: '0'
          inventory_link: MODEL
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: Application
              value: Inventory
        - uuid: 8efb1382f2464867ab454e123cd48a73
          name: 'Operating system'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: 'system.sw.os[sysDescr.0]'
          delay: 1h
          history: 90d
          value_type: CHAR
          trends: '0'
          inventory_link: OS
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: Application
              value: Inventory
      discovery_rules:
        - uuid: 9055e5ff9f3d4780a848b0ce866770b8
          name: 'Arista egress queue discovery'
          type: DEPENDENT
          key: arista.egress.queue.discovery
          delay: '0'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'ARISTA-QUEUE-MIB egress queues joined with IF-MIB ifName/ifAlias. Queue index is ifIndex.queueIndex.packetType.'
          item_prototypes:
            - uuid: c4b450cee8af48f6ab4dc60aaa690cc5
              name: 'Interface {#IFLABEL}: Egress queue {#QUEUE} ({#PACKETTYPE_NAME}) raw drop counter'
              type: DEPENDENT
              key: 'arista.queue.egress.drops[{#IFINDEX},{#QUEUE},{#PACKETTYPE}]'
              delay: '0'
              history: 1d
              trends: '0'
              description: 'Technical cumulative ARISTA-QUEUE-MIB egress drop counter used as the source for drop-rate calculation. It only increases until the switch/counter resets. Long-term history is intentionally disabled; use the drop-rate item for operations and graphs.'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.30065.3.6.1.2.1.6.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: arista.queue.walk
              tags:
                - tag: Application
                  value: 'Interfaces Queues'
                - tag: description
                  value: '{#IFALIAS}'
                - tag: direction
                  value: egress
                - tag: interface
                  value: '{#IFNAME}'
                - tag: metric
                  value: drop_counter_raw
                - tag: queue
                  value: '{#QUEUE}'
            - uuid: 9cbbd2e06e774f58a68c6ea9bdac5f9c
              name: 'Interface {#IFLABEL}: Egress queue {#QUEUE} ({#PACKETTYPE_NAME}) drop rate'
              type: DEPENDENT
              key: 'arista.queue.egress.drop_rate[{#IFINDEX},{#QUEUE},{#PACKETTYPE}]'
              delay: '0'
              history: 90d
              value_type: FLOAT
              units: pps
              description: 'Rate of newly dropped packets for this egress queue, calculated from the ARISTA-QUEUE-MIB cumulative drop counter. The raw cumulative counter is kept separately. Counter resets are handled by Zabbix CHANGE_PER_SECOND preprocessing.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              master_item:
                key: 'arista.queue.egress.drops[{#IFINDEX},{#QUEUE},{#PACKETTYPE}]'
              tags:
                - tag: Application
                  value: 'Interfaces Queues'
                - tag: description
                  value: '{#IFALIAS}'
                - tag: direction
                  value: egress
                - tag: interface
                  value: '{#IFNAME}'
                - tag: metric
                  value: drop_rate
                - tag: packet_type
                  value: '{#PACKETTYPE_NAME}'
                - tag: queue
                  value: '{#QUEUE}'
              trigger_prototypes:
                - uuid: 3d4de338da1a4cb4b1713577fe5eabf8
                  expression: 'avg(/Arista SNMP/arista.queue.egress.drop_rate[{#IFINDEX},{#QUEUE},{#PACKETTYPE}],5m)>{$ARISTA.QUEUE.DROP_RATE.WARN:"{#IFNAME}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'avg(/Arista SNMP/arista.queue.egress.drop_rate[{#IFINDEX},{#QUEUE},{#PACKETTYPE}],15m)<{$ARISTA.QUEUE.DROP_RATE.RECOVERY.WARN:"{#IFNAME}"} or avg(/Arista SNMP/arista.queue.egress.drop_rate[{#IFINDEX},{#QUEUE},{#PACKETTYPE}],5m)>{$ARISTA.QUEUE.DROP_RATE.HIGH:"{#IFNAME}"}'
                  name: 'Interface {#IFLABEL}: Egress queue {#QUEUE} ({#PACKETTYPE_NAME}) drop rate warning (>{$ARISTA.QUEUE.DROP_RATE.WARN:"{#IFNAME}"} pps avg for 5m)'
                  opdata: 'Current drop rate: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'ARISTA-QUEUE-MIB egress queue packet drop rate. Warning opens when the 5-minute average exceeds the warning threshold. It recovers when the 15-minute average falls below the warning recovery threshold. If the second-level threshold is reached, the warning is recovered and the higher-level trigger takes over.'
                  dependencies:
                    - name: 'Interface {#IFLABEL}: Egress queue {#QUEUE} ({#PACKETTYPE_NAME}) high drop rate (>{$ARISTA.QUEUE.DROP_RATE.HIGH:"{#IFNAME}"} pps avg for 5m)'
                      expression: 'avg(/Arista SNMP/arista.queue.egress.drop_rate[{#IFINDEX},{#QUEUE},{#PACKETTYPE}],5m)>{$ARISTA.QUEUE.DROP_RATE.HIGH:"{#IFNAME}"}'
                      recovery_expression: 'avg(/Arista SNMP/arista.queue.egress.drop_rate[{#IFINDEX},{#QUEUE},{#PACKETTYPE}],15m)<{$ARISTA.QUEUE.DROP_RATE.RECOVERY.HIGH:"{#IFNAME}"}'
                  tags:
                    - tag: description
                      value: '{#IFALIAS}'
                    - tag: direction
                      value: egress
                    - tag: interface
                      value: '{#IFNAME}'
                    - tag: queue
                      value: '{#QUEUE}'
                - uuid: fbb1907f41474f53886de1b655662d72
                  expression: 'avg(/Arista SNMP/arista.queue.egress.drop_rate[{#IFINDEX},{#QUEUE},{#PACKETTYPE}],5m)>{$ARISTA.QUEUE.DROP_RATE.HIGH:"{#IFNAME}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'avg(/Arista SNMP/arista.queue.egress.drop_rate[{#IFINDEX},{#QUEUE},{#PACKETTYPE}],15m)<{$ARISTA.QUEUE.DROP_RATE.RECOVERY.HIGH:"{#IFNAME}"}'
                  name: 'Interface {#IFLABEL}: Egress queue {#QUEUE} ({#PACKETTYPE_NAME}) high drop rate (>{$ARISTA.QUEUE.DROP_RATE.HIGH:"{#IFNAME}"} pps avg for 5m)'
                  opdata: 'Current drop rate: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'ARISTA-QUEUE-MIB egress queue packet drop rate. Second severity level. Opens when the 5-minute average exceeds the high threshold and recovers when the 15-minute average falls below the configured high recovery threshold.'
                  tags:
                    - tag: description
                      value: '{#IFALIAS}'
                    - tag: direction
                      value: egress
                    - tag: interface
                      value: '{#IFNAME}'
                    - tag: queue
                      value: '{#QUEUE}'
          graph_prototypes:
            - uuid: d9bfe87a444848c0b48c9ca91dad08da
              name: 'Interface {#IFLABEL}: Egress queue {#QUEUE} ({#PACKETTYPE_NAME}) drop rate'
              ymin_type_1: FIXED
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
                  item:
                    host: 'Arista SNMP'
                    key: 'arista.queue.egress.drop_rate[{#IFINDEX},{#QUEUE},{#PACKETTYPE}]'
              discover: NO_DISCOVER
          master_item:
            key: arista.queue.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#DROPPED}'
                - 1.3.6.1.4.1.30065.3.6.1.2.1.6
                - '0'
                - '{#IFNAME}'
                - 1.3.6.1.2.1.31.1.1.1.1
                - '0'
                - '{#IFALIAS}'
                - 1.3.6.1.2.1.31.1.1.1.18
                - '0'
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var ifmap = {};
                  var out = [];

                  data.forEach(function (e) {
                      var idx = String(e['{#SNMPINDEX}'] || '');
                      if (idx.indexOf('.') === -1 && e['{#IFNAME}'] !== undefined) {
                          ifmap[idx] = {
                              name: String(e['{#IFNAME}'] || ''),
                              alias: String(e['{#IFALIAS}'] || '')
                          };
                      }
                  });

                  data.forEach(function (e) {
                      if (e['{#DROPPED}'] === undefined) return;
                      var idx = String(e['{#SNMPINDEX}'] || '');
                      var p = idx.split('.');
                      if (p.length < 3) return;
                      var inf = ifmap[p[0]];
                      if (!inf || !inf.name) return;
                      e['{#IFINDEX}'] = p[0];
                      e['{#QUEUE}'] = p[1] || '';
                      e['{#PACKETTYPE}'] = p[2] || '';
                      var pt = {'0':'unicast','1':'multicast','2':'mixed'};
                      e['{#PACKETTYPE_NAME}'] = pt[e['{#PACKETTYPE}']] || ('type ' + e['{#PACKETTYPE}']);
                      e['{#IFNAME}'] = inf.name;
                      e['{#IFALIAS}'] = inf.alias;
                      e['{#IFLABEL}'] = inf.alias ? inf.name + ' (' + inf.alias + ')' : inf.name;
                      out.push(e);
                  });
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 6fb67cc6c96443a4b6fc3125bfa0f6d7
          name: 'Arista hardware resource utilization discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#RESOURCE},1.3.6.1.4.1.30065.3.22.1.1.1.1,{#FEATURE},1.3.6.1.4.1.30065.3.22.1.1.1.2,{#FORWARDING_ELEMENT},1.3.6.1.4.1.30065.3.22.1.1.1.3]'
          key: arista.hw.util.discovery
          delay: 1h
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'ARISTA-HARDWARE-UTILIZATION-MIB hardware/TCAM resource discovery.'
          item_prototypes:
            - uuid: b71f746571ff4a4da4c44456baae5dcf
              name: 'HW {#RESOURCE}/{#FEATURE}/{#FORWARDING_ELEMENT}: Free entries'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.30065.3.22.1.1.1.5.{#SNMPINDEX}'
              key: 'arista.hw.util.free[{#SNMPINDEX}]'
              delay: 5m
              history: 90d
              tags:
                - tag: Application
                  value: 'Hardware utilization'
            - uuid: 1fa7663c512540eabf272c4f19ec5bcc
              name: 'HW {#RESOURCE}/{#FEATURE}/{#FORWARDING_ELEMENT}: In-use entries'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.30065.3.22.1.1.1.4.{#SNMPINDEX}'
              key: 'arista.hw.util.inuse[{#SNMPINDEX}]'
              delay: 5m
              history: 90d
              tags:
                - tag: Application
                  value: 'Hardware utilization'
            - uuid: e0818048f42b4fbf9b1b84aadd158f4b
              name: 'HW {#RESOURCE}/{#FEATURE}/{#FORWARDING_ELEMENT}: Maximum entries'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.30065.3.22.1.1.1.7.{#SNMPINDEX}'
              key: 'arista.hw.util.max[{#SNMPINDEX}]'
              delay: 1h
              history: 90d
              tags:
                - tag: Application
                  value: 'Hardware utilization'
            - uuid: e8e771bec532457f89d6d8dc743532e0
              name: 'HW {#RESOURCE}/{#FEATURE}/{#FORWARDING_ELEMENT}: Utilization'
              type: CALCULATED
              key: 'arista.hw.util.pused[{#SNMPINDEX}]'
              delay: 5m
              history: 90d
              value_type: FLOAT
              units: '%'
