                          e['{#PORT}']=port;
                          e['{#IFNAME}']=ifname;
                          e['{#IFALIAS}']=alias;
                          e['{#IFLABEL}']=label;
                          e['{#ALIAS_PORT}']=ifname;
                          e['{#SENSOR_INFO}']=info.replace(port,label);
                      }
                      var dm=info.match(/\b(TX|RX)\b/i);
                      if (dm) e['{#SENSOR_DIRECTION}']=dm[1].toUpperCase();
                      out.push(e);
