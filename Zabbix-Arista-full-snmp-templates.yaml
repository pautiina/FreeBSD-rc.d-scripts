                      function scaleExp(s) { var x=enumInt(s); var e={1:-24,2:-21,3:-18,4:-15,5:-12,6:-9,7:-6,8:-3,9:0,10:3,11:6,12:9,13:12,14:15,15:18,16:21,17:24}[x]; return e===undefined?0:e; }
