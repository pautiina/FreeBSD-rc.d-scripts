                      var pm = info.match(/Ethernet\d+(?:\/\d+)?/i);
                      if (pm) {
                          var port = pm[0];
                          var candidates=[port];
                          var lm=port.match(/^(Ethernet\d+)\/(\d+)$/i);
                          if (lm) {
                              if (Number(lm[2]) !== 1) candidates.push(lm[1]+'/1');
