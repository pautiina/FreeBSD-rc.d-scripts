              trigger_prototypes:
                - uuid: cf9faf9edf424065b045d8b6be1e125d
                  expression: 'last(/Arista SNMP/arista.phy.fec.uncorrected[{#IFNAME}])-min(/Arista SNMP/arista.phy.fec.uncorrected[{#IFNAME}],5m)>0'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Arista SNMP/arista.phy.fec.uncorrected[{#IFNAME}])=min(/Arista SNMP/arista.phy.fec.uncorrected[{#IFNAME}],15m)'
                  name: 'Interface {#IFNAME}({#IFALIAS}): FEC uncorrected codewords detected'
                  opdata: 'New uncorrected codewords: {FUNCTION.VALUE1}'
                  priority: HIGH
                  description: 'ARISTA-PHY-MIB uncorrected FEC codeword counter increased in the last 5 minutes. The problem remains open until the counter is quiet for 15 minutes.'
            - uuid: 48bf437f7cc54bd2a0f06611ae717d28
              name: 'Interface {#IFNAME}({#IFALIAS}): Post-FEC/PCS bit errors'
              type: DEPENDENT
              key: 'arista.phy.pcs.errors[{#IFNAME}]'
              delay: '0'
              history: 90d
              description: 'ARISTA-PHY-MIB aristaPhyIntfPcsBer counter. With FEC enabled this is post-FEC bit errors; without FEC it is raw bit errors.'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.30065.3.37.1.1.2.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: arista.phy.walk
              tags:
                - tag: Application
                  value: 'Interfaces PHY/FEC'
              trigger_prototypes:
                - uuid: 83df8b8427df4248ab31142caf6a1502
                  expression: 'last(/Arista SNMP/arista.phy.pcs.errors[{#IFNAME}])-min(/Arista SNMP/arista.phy.pcs.errors[{#IFNAME}],5m)>{$ARISTA.PHY.PCS.ERRORS.WARN:"{#IFNAME}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Arista SNMP/arista.phy.pcs.errors[{#IFNAME}])=min(/Arista SNMP/arista.phy.pcs.errors[{#IFNAME}],10m)'
                  name: 'Interface {#IFNAME}({#IFALIAS}): PHY bit errors are increasing'
                  opdata: 'New errors: {FUNCTION.VALUE1}'
                  priority: WARNING
                  description: 'ARISTA-PHY-MIB post-FEC/PCS error counter increased above the threshold in a rolling 5-minute window. Recovers after 10 minutes without another increase.'
            - uuid: 02dc9862077d41f1b1d59952975aef3e
              name: 'Interface {#IFNAME}({#IFALIAS}): PHY state changes'
              type: DEPENDENT
              key: 'arista.phy.statechanges[{#IFNAME}]'
              delay: '0'
              history: 90d
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.30065.3.37.1.1.7.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: arista.phy.walk
              tags:
                - tag: Application
                  value: 'Interfaces PHY/FEC'
              trigger_prototypes:
                - uuid: c86a2035ec694709a59d25639ae3644a
                  expression: 'last(/Arista SNMP/arista.phy.statechanges[{#IFNAME}])-min(/Arista SNMP/arista.phy.statechanges[{#IFNAME}],10m)>={$ARISTA.PHY.STATECHANGES.WARN:"{#IFNAME}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Arista SNMP/arista.phy.statechanges[{#IFNAME}])=min(/Arista SNMP/arista.phy.statechanges[{#IFNAME}],15m)'
                  name: 'Interface {#IFNAME}({#IFALIAS}): PHY state is flapping'
                  opdata: 'PHY transitions since previous poll: {FUNCTION.VALUE1}'
                  priority: WARNING
                  description: 'ARISTA-PHY-MIB state transition counter. Uses a rolling 10-minute window and recovers after 15 minutes without another transition.'
          master_item:
            key: arista.phy.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#PHY_CAP}'
                - 1.3.6.1.4.1.30065.3.37.1.1.1
                - '0'
                - '{#IFNAME}'
                - 1.3.6.1.2.1.31.1.1.1.1
                - '0'
                - '{#IFALIAS}'
                - 1.3.6.1.2.1.31.1.1.1.18
                - '0'
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var out = [];

                  data.forEach(function (e) {
                      // IF-MIB rows may be present even when ARISTA-PHY-MIB is absent.
                      // Only a row that actually contains PHY_CAP is a PHY/FEC-capable interface.
                      if (!Object.prototype.hasOwnProperty.call(e, '{#PHY_CAP}')) return;

                      var cap = String(e['{#PHY_CAP}'] === null ? '' : e['{#PHY_CAP}']).trim();
                      if (cap === '') return;

                      var idx = String(e['{#SNMPINDEX}'] || '');
                      e['{#IFNAME}'] = String(e['{#IFNAME}'] || ('ifIndex ' + idx));
                      e['{#IFALIAS}'] = String(e['{#IFALIAS}'] || '');
                      out.push(e);
                  });

                  return JSON.stringify(out);
        - uuid: 16a62312cfda49f0be73474fb0d6dcd2
          name: 'Arista queue interface summary discovery'
          type: DEPENDENT
          key: arista.queue.interface.discovery
          delay: '0'
          lifetime: 30d
          description: 'Discovers one row per interface that has ARISTA-QUEUE-MIB counters. Provides compact grouped queue graphs without additional SNMP polling. Detailed per-queue/type items and triggers remain unchanged. The grouped queue graph uses up to eight discovered egress queue indexes plus total ingress.'
          item_prototypes:
            - uuid: 718f3c74227f41e48bad6ad37a1dc73c
              name: 'Interface {#IFLABEL}: Egress mixed total drop rate'
              type: CALCULATED
              key: 'arista.queue.egress.mixed_rate[{#IFINDEX}]'
              history: 30d
              value_type: FLOAT
              units: pps
              params: 'last(//arista.queue.egress.total_rate[{#IFINDEX}])-last(//arista.queue.egress.unicast_rate[{#IFINDEX}])-last(//arista.queue.egress.multicast_rate[{#IFINDEX}])'
              description: 'Egress mixed-packet drop rate in pps. Calculated as total egress drop rate minus unicast and multicast drop rates. ARISTA-QUEUE-MIB allows platforms to omit some PacketType table indices; this calculation therefore yields 0 pps when the platform does not expose mixedPacketType(2), while still representing it correctly when that counter is present.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'var v=Number(value);if(!isFinite(v)) throw ''Mixed rate is not finite'';if(v<0 && v>-0.000001) v=0;if(v<0) throw ''Mixed rate became negative'';return Math.round(v*1000000)/1000000;'
              tags:
                - tag: Application
                  value: 'Interfaces Queues'
                - tag: description
                  value: '{#IFALIAS}'
                - tag: direction
                  value: egress
                - tag: interface
                  value: '{#IFNAME}'
                - tag: metric
                  value: packet_type_drop_rate
                - tag: packet_type
                  value: mixed
            - uuid: 3de2a561e7f24a72ac7ad5a79c9a3f50
              name: 'Interface {#IFLABEL}: Egress multicast total drop rate'
              type: DEPENDENT
              key: 'arista.queue.egress.multicast_rate[{#IFINDEX}]'
              delay: '0'
              history: 30d
              value_type: FLOAT
              units: pps
              description: 'Grouped queue graph source. Sum of all egress multicast queue drop counters, converted to pps.'
              preprocessing:
                - type: SNMP_WALK_TO_JSON
                  parameters:
                    - '{#SUMVAL}'
                    - 1.3.6.1.4.1.30065.3.6.1.2.1.6
                    - '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var targetIf = '{#IFINDEX}';
                      var targetType = '1';
                      var rows = JSON.parse(value);
                      var total = 0;
                      var found = false;
                      rows.forEach(function(e) {
                          var idx = String(e['{#SNMPINDEX}'] === undefined ? '' : e['{#SNMPINDEX}']);
                          if (!idx) return;
                          var p = idx.split('.');
                          if (p[0] !== targetIf) return;
                          if (p.length < 3 || p[2] !== targetType) return;
                          var raw = e['{#SUMVAL}'];
                          if (raw === undefined || raw === null || raw === '') return;
                          var n = Number(raw);
                          if (!isFinite(n)) return;
                          total += n;
                          found = true;
                      });
                      if (!found) throw 'No matching queue counters';
                      return total;
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              master_item:
                key: arista.queue.walk
              tags:
                - tag: Application
                  value: 'Interfaces Queues'
                - tag: description
                  value: '{#IFALIAS}'
                - tag: direction
                  value: egress
                - tag: interface
                  value: '{#IFNAME}'
                - tag: metric
                  value: packet_type_drop_rate
                - tag: packet_type
                  value: multicast
            - uuid: efd394c5f9614d5798210aa8a8cc190f
              name: 'Interface {#IFLABEL}: Egress queue {#EGQ1} total drop rate'
              type: DEPENDENT
              key: 'arista.queue.egress.queue_rate[{#IFINDEX},{#EGQ1}]'
              delay: '0'
              history: 30d
              value_type: FLOAT
              units: pps
              description: 'Grouped queue graph source. Sum of all packet types for this egress queue index, converted from the cumulative ARISTA-QUEUE-MIB counter to packets per second.'
              preprocessing:
                - type: SNMP_WALK_TO_JSON
                  parameters:
                    - '{#SUMVAL}'
                    - 1.3.6.1.4.1.30065.3.6.1.2.1.6
                    - '0'
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var targetIf = '{#IFINDEX}';
                      var targetQueue = '{#EGQ1}';
                      var rows = JSON.parse(value);
                      var total = 0;
                      var found = false;
                      rows.forEach(function(e) {
                          var idx = String(e['{#SNMPINDEX}'] === undefined ? '' : e['{#SNMPINDEX}']);
                          if (!idx) return;
                          var p = idx.split('.');
                          if (p[0] !== targetIf) return;
                          if (targetQueue.indexOf('none') === 0 || p[1] !== targetQueue) return;
                          var raw = e['{#SUMVAL}'];
                          if (raw === undefined || raw === null || raw === '') return;
                          var n = Number(raw);
                          if (!isFinite(n)) return;
                          total += n;
                          found = true;
                      });
                      if (!found) throw 'No matching queue counters';
                      return total;
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              master_item:
                key: arista.queue.walk
              tags:
                - tag: Application
                  value: 'Interfaces Queues'
                - tag: description
                  value: '{#IFALIAS}'
                - tag: direction
                  value: egress
                - tag: interface
                  value: '{#IFNAME}'
                - tag: metric
                  value: grouped_queue_drop_rate
                - tag: queue
                  value: '{#EGQ1}'
            - uuid: 385d08dc73124dd997aecb7e21de4cc1
              name: 'Interface {#IFLABEL}: Egress queue {#EGQ2} total drop rate'
