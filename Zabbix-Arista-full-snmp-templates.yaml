                          if (n) ifByName[n.toLowerCase()] = {name:n, alias:str(e['{#IFALIAS}']).trim()};
                      }
                  });

                  data.forEach(function(e) {
                      // Filter IF-MIB-only rows before the LLD rule filter sees them.
                      if (!Object.prototype.hasOwnProperty.call(e, '{#SENSOR_TYPE}')) return;

                      var fields = ['{#SENSOR_TYPE}','{#SENSOR_SCALE}','{#SENSOR_PRECISION}','{#SENSOR_VALUE}','{#SENSOR_STATUS}','{#SENSOR_INFO}',
                                    '{#THRESHOLD_LO_WARN}','{#THRESHOLD_LO_CRIT}','{#THRESHOLD_HI_WARN}','{#THRESHOLD_HI_CRIT}'];
                      fields.forEach(function(f) { if (!Object.prototype.hasOwnProperty.call(e,f) || e[f] === null) e[f]=''; });

                      ['{#THRESHOLD_LO_WARN}','{#THRESHOLD_LO_CRIT}','{#THRESHOLD_HI_WARN}','{#THRESHOLD_HI_CRIT}'].forEach(function(f) {
                          if (badThreshold(e[f])) e[f]='';
                      });

                      var info = str(e['{#SENSOR_INFO}']).trim();
                      if (!info) info = 'Sensor ' + str(e['{#SNMPINDEX}']);
                      e['{#SENSOR_INFO}'] = info;
                      e['{#PORT}']=''; e['{#IFNAME}']=''; e['{#IFALIAS}']=''; e['{#IFLABEL}']=''; e['{#ALIAS_PORT}']=''; e['{#SENSOR_DIRECTION}']='';

                      var pm = info.match(/Ethernet\d+(?:\/\d+)?/i);
                      if (pm) {
                          var port = pm[0];
                          var candidates=[port];
                          var lm=port.match(/^(Ethernet\d+)\/(\d+)$/i);
                          if (lm) {
