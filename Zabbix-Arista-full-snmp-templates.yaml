        - uuid: ae9af5b965d84558b1dec856fb38d815
          name: 'Arista error-disabled interfaces discovery'
          type: DEPENDENT
          key: arista.if.errdisabled.discovery
          delay: '0'
          lifetime: 30d
          description: 'Capability-safe ARISTA-IF-MIB::aristaIfErrDisabledReason discovery. If the MIB object is absent, the IF-MIB-only walk data is filtered out and no unsupported per-interface items are created.'
          item_prototypes:
            - uuid: 180a08c8f52e4e50ac785e1110b30813
              name: 'Interface {#IFNAME}({#IFALIAS}): Error-disabled reason'
              type: DEPENDENT
              key: 'arista.if.errdisabled.reason[{#IFNAME}]'
              delay: '0'
              history: 30d
              value_type: CHAR
              trends: '0'
              description: 'ARISTA-IF-MIB::aristaIfErrDisabledReason.'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.30065.3.15.1.1.1.10.{#SNMPINDEX}'
                    - '0'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: arista.if.errdisabled.walk
              tags:
                - tag: Application
                  value: 'Interface {#IFNAME}({#IFALIAS})'
                - tag: Application
                  value: 'Network interfaces'
              trigger_prototypes:
                - uuid: 385ad9da130541b28fbb54c2253da438
                  expression: 'length(last(/Arista SNMP/arista.if.errdisabled.reason[{#IFNAME}]))>0'
                  name: 'Interface {#IFNAME}({#IFALIAS}): Error-disabled ({ITEM.LASTVALUE1})'
                  opdata: 'Reason: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'ARISTA-IF-MIB reports a non-empty error-disabled reason.'
          master_item:
            key: arista.if.errdisabled.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#ERRREASON}'
                - 1.3.6.1.4.1.30065.3.15.1.1.1.10
                - '0'
                - '{#IFNAME}'
                - 1.3.6.1.2.1.31.1.1.1.1
                - '0'
                - '{#IFALIAS}'
                - 1.3.6.1.2.1.31.1.1.1.18
                - '0'
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var out = [];

                  data.forEach(function (e) {
                      // A supported healthy interface may have an empty reason string.
                      // Test field presence, not whether the string is non-empty.
                      if (!Object.prototype.hasOwnProperty.call(e, '{#ERRREASON}')) return;

                      var idx = String(e['{#SNMPINDEX}'] || '');
                      e['{#IFNAME}'] = String(e['{#IFNAME}'] || ('ifIndex ' + idx));
                      e['{#IFALIAS}'] = String(e['{#IFALIAS}'] || '');
                      out.push(e);
                  });

                  return JSON.stringify(out);
        - uuid: 9ca1a1bd26b44b9f896d2223148d65ce
          name: 'Arista ingress queue discovery'
          type: DEPENDENT
          key: arista.ingress.queue.discovery
          delay: '0'
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'ARISTA-QUEUE-MIB ingress queues joined with IF-MIB ifName/ifAlias. Queue index is ifIndex.queueIndex.'
          item_prototypes:
            - uuid: afdb0f8d6f36411285d69e94c22be670
              name: 'Interface {#IFLABEL}: Ingress queue {#QUEUE} raw drop counter'
              type: DEPENDENT
              key: 'arista.queue.ingress.drops[{#IFINDEX},{#QUEUE}]'
              delay: '0'
              history: 1d
              trends: '0'
              description: 'Technical cumulative ARISTA-QUEUE-MIB ingress drop counter used as the source for drop-rate calculation. It only increases until the switch/counter resets. Long-term history is intentionally disabled; use the drop-rate item for operations and graphs.'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.30065.3.6.1.1.1.3.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: arista.queue.walk
              tags:
                - tag: Application
                  value: 'Interfaces Queues'
                - tag: description
                  value: '{#IFALIAS}'
                - tag: direction
                  value: ingress
                - tag: interface
                  value: '{#IFNAME}'
                - tag: metric
                  value: drop_counter_raw
                - tag: queue
                  value: '{#QUEUE}'
            - uuid: e80734b81f094c33b2a8dcd3e62cb451
              name: 'Interface {#IFLABEL}: Ingress queue {#QUEUE} drop rate'
              type: DEPENDENT
              key: 'arista.queue.ingress.drop_rate[{#IFINDEX},{#QUEUE}]'
              delay: '0'
              history: 90d
              value_type: FLOAT
              units: pps
              description: 'Rate of newly dropped packets for this ingress queue, calculated from the ARISTA-QUEUE-MIB cumulative drop counter. The raw cumulative counter is kept separately. Counter resets are handled by Zabbix CHANGE_PER_SECOND preprocessing.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              master_item:
                key: 'arista.queue.ingress.drops[{#IFINDEX},{#QUEUE}]'
              tags:
                - tag: Application
                  value: 'Interfaces Queues'
                - tag: description
                  value: '{#IFALIAS}'
                - tag: direction
                  value: ingress
                - tag: interface
                  value: '{#IFNAME}'
                - tag: metric
                  value: drop_rate
                - tag: queue
                  value: '{#QUEUE}'
              trigger_prototypes:
                - uuid: 14f4fd52f6114870bd6edecacdfadd01
                  expression: 'avg(/Arista SNMP/arista.queue.ingress.drop_rate[{#IFINDEX},{#QUEUE}],5m)>{$ARISTA.QUEUE.DROP_RATE.WARN:"{#IFNAME}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'avg(/Arista SNMP/arista.queue.ingress.drop_rate[{#IFINDEX},{#QUEUE}],15m)<{$ARISTA.QUEUE.DROP_RATE.RECOVERY.WARN:"{#IFNAME}"} or avg(/Arista SNMP/arista.queue.ingress.drop_rate[{#IFINDEX},{#QUEUE}],5m)>{$ARISTA.QUEUE.DROP_RATE.HIGH:"{#IFNAME}"}'
                  name: 'Interface {#IFLABEL}: Ingress queue {#QUEUE} drop rate warning (>{$ARISTA.QUEUE.DROP_RATE.WARN:"{#IFNAME}"} pps avg for 5m)'
                  opdata: 'Current drop rate: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: 'ARISTA-QUEUE-MIB ingress queue packet drop rate. Warning opens when the 5-minute average exceeds the warning threshold. It recovers when the 15-minute average falls below the warning recovery threshold. If the second-level threshold is reached, the warning is recovered and the higher-level trigger takes over.'
                  dependencies:
                    - name: 'Interface {#IFLABEL}: Ingress queue {#QUEUE} high drop rate (>{$ARISTA.QUEUE.DROP_RATE.HIGH:"{#IFNAME}"} pps avg for 5m)'
                      expression: 'avg(/Arista SNMP/arista.queue.ingress.drop_rate[{#IFINDEX},{#QUEUE}],5m)>{$ARISTA.QUEUE.DROP_RATE.HIGH:"{#IFNAME}"}'
                      recovery_expression: 'avg(/Arista SNMP/arista.queue.ingress.drop_rate[{#IFINDEX},{#QUEUE}],15m)<{$ARISTA.QUEUE.DROP_RATE.RECOVERY.HIGH:"{#IFNAME}"}'
                  tags:
                    - tag: description
                      value: '{#IFALIAS}'
                    - tag: direction
                      value: ingress
                    - tag: interface
                      value: '{#IFNAME}'
                    - tag: queue
                      value: '{#QUEUE}'
                - uuid: a49bd387efef438da6046ad067a2c2bd
                  expression: 'avg(/Arista SNMP/arista.queue.ingress.drop_rate[{#IFINDEX},{#QUEUE}],5m)>{$ARISTA.QUEUE.DROP_RATE.HIGH:"{#IFNAME}"}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'avg(/Arista SNMP/arista.queue.ingress.drop_rate[{#IFINDEX},{#QUEUE}],15m)<{$ARISTA.QUEUE.DROP_RATE.RECOVERY.HIGH:"{#IFNAME}"}'
                  name: 'Interface {#IFLABEL}: Ingress queue {#QUEUE} high drop rate (>{$ARISTA.QUEUE.DROP_RATE.HIGH:"{#IFNAME}"} pps avg for 5m)'
                  opdata: 'Current drop rate: {ITEM.LASTVALUE1}'
                  priority: AVERAGE
                  description: 'ARISTA-QUEUE-MIB ingress queue packet drop rate. Second severity level. Opens when the 5-minute average exceeds the high threshold and recovers when the 15-minute average falls below the configured high recovery threshold.'
                  tags:
                    - tag: description
                      value: '{#IFALIAS}'
                    - tag: direction
                      value: ingress
                    - tag: interface
                      value: '{#IFNAME}'
                    - tag: queue
                      value: '{#QUEUE}'
          graph_prototypes:
            - uuid: d695c4f7a8614c4cacad22bc0c56e1ae
              name: 'Interface {#IFLABEL}: Ingress queue {#QUEUE} drop rate'
              ymin_type_1: FIXED
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 199C0D
                  item:
                    host: 'Arista SNMP'
                    key: 'arista.queue.ingress.drop_rate[{#IFINDEX},{#QUEUE}]'
              discover: NO_DISCOVER
          master_item:
            key: arista.queue.walk
          preprocessing:
            - type: SNMP_WALK_TO_JSON
              parameters:
                - '{#DROPPED}'
                - 1.3.6.1.4.1.30065.3.6.1.1.1.3
                - '0'
                - '{#IFNAME}'
                - 1.3.6.1.2.1.31.1.1.1.1
                - '0'
                - '{#IFALIAS}'
                - 1.3.6.1.2.1.31.1.1.1.18
                - '0'
            - type: JAVASCRIPT
              parameters:
                - |
                  var data = JSON.parse(value);
                  var ifmap = {};
                  var out = [];

                  data.forEach(function (e) {
                      var idx = String(e['{#SNMPINDEX}'] || '');
                      if (idx.indexOf('.') === -1 && e['{#IFNAME}'] !== undefined) {
                          ifmap[idx] = {
                              name: String(e['{#IFNAME}'] || ''),
                              alias: String(e['{#IFALIAS}'] || '')
                          };
                      }
                  });

                  data.forEach(function (e) {
                      if (e['{#DROPPED}'] === undefined) return;
                      var idx = String(e['{#SNMPINDEX}'] || '');
                      var p = idx.split('.');
                      if (p.length < 2) return;
                      var inf = ifmap[p[0]];
                      if (!inf || !inf.name) return;
                      e['{#IFINDEX}'] = p[0];
                      e['{#QUEUE}'] = p[1] || '';
                      e['{#IFNAME}'] = inf.name;
                      e['{#IFALIAS}'] = inf.alias;
                      e['{#IFLABEL}'] = inf.alias ? inf.name + ' (' + inf.alias + ')' : inf.name;
                      out.push(e);
                  });
                  return JSON.stringify(out);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
        - uuid: 46e042b3663649be9d97c906fdcffebb
          name: 'Arista PHY/FEC discovery'
          type: DEPENDENT
          key: arista.phy.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#PHY_CAP}'
                value: .+
                formulaid: A
          lifetime: 30d
          description: 'Capability-safe ARISTA-PHY-MIB discovery from the arista.phy.walk master item. Older EOS versions that do not expose ARISTA-PHY-MIB return zero LLD rows instead of producing missing {#PHY_CAP} filter errors.'
          item_prototypes:
            - uuid: be8fc7619c5a41498d3375f6a2fea000
              name: 'Interface {#IFNAME}({#IFALIAS}): FEC uncorrected codewords'
              type: DEPENDENT
              key: 'arista.phy.fec.uncorrected[{#IFNAME}]'
              delay: '0'
              history: 90d
              description: 'ARISTA-PHY-MIB. Non-zero growth indicates codewords FEC could not correct; Arista describes their presence as an unhealthy link.'
              preprocessing:
                - type: SNMP_WALK_VALUE
                  parameters:
                    - '1.3.6.1.4.1.30065.3.37.1.1.6.{#SNMPINDEX}'
                    - '0'
              master_item:
                key: arista.phy.walk
              tags:
                - tag: Application
