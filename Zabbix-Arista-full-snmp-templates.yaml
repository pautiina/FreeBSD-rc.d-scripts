                      var type = s(e['{#SENSOR_TYPE}']);
                      var rawInfo = s(e['{#SENSOR_INFO}']);
                      if (!rawInfo) rawInfo = 'Sensor ' + s(e['{#SNMPINDEX}']);

                      var port = sensorPort(rawInfo);
                      var root = port ? modulePort(port) : '';
                      var inf = port ? findIf(port) : {name:'',alias:''};
                      var label = port ? (inf.alias ? port + '(' + inf.alias + ')' : port) : '';

                      e['{#SENSOR_INFO}'] = port ? rawInfo.replace(port,label) : rawInfo;
                      e['{#PORT}'] = port;
                      e['{#IFNAME}'] = inf.name || port;
                      e['{#IFALIAS}'] = inf.alias || '';
                      e['{#IFLABEL}'] = label;
                      e['{#ALIAS_PORT}'] = inf.name || port;
                      e['{#SENSOR_DIRECTION}'] = direction(rawInfo);
                      e['{#ROW_KIND}'] = (type === '6') ? 'POWER' : 'AUX';

                      // Safe module macro defaults for rows that will be suppressed by overrides.
                      e['{#MODULE}'] = root || port;
                      e['{#MODULE_LABEL}'] = label || port;
                      e['{#LANE_COUNT}'] = '1';
                      e['{#LANE_MODE}'] = 'SINGLE';

                      for (var n=1; n<=4; n++) {
                          e['{#LANE'+n+'_NUM}'] = String(n);
                          e['{#LANE'+n+'_DISPLAY}'] = (n===1 ? 'signal' : 'lane '+n);
                          e['{#RX'+n+'_PRESENT}'] = (n===1 ? '1' : '0');
                          e['{#TX'+n+'_PRESENT}'] = (n===1 ? '1' : '0');
                          e['{#BIAS'+n+'_PRESENT}'] = '0';

                          e['{#RX'+n+'_INDEX}'] = s(e['{#SNMPINDEX}']);
                          e['{#RX'+n+'_SCALE}'] = s(e['{#SENSOR_SCALE}']);
                          e['{#RX'+n+'_PRECISION}'] = s(e['{#SENSOR_PRECISION}']);
                          e['{#TX'+n+'_INDEX}'] = s(e['{#SNMPINDEX}']);
                          e['{#TX'+n+'_SCALE}'] = s(e['{#SENSOR_SCALE}']);
                          e['{#TX'+n+'_PRECISION}'] = s(e['{#SENSOR_PRECISION}']);
                          e['{#BIAS'+n+'_INDEX}'] = s(e['{#SNMPINDEX}']);
                          e['{#BIAS'+n+'_SCALE}'] = s(e['{#SENSOR_SCALE}']);
                          e['{#BIAS'+n+'_PRECISION}'] = s(e['{#SENSOR_PRECISION}']);
                      }

                      e['{#TEMP_PRESENT}'] = '0';
                      e['{#TEMP_INDEX}'] = s(e['{#SNMPINDEX}']);
                      e['{#TEMP_SCALE}'] = s(e['{#SENSOR_SCALE}']);
                      e['{#TEMP_PRECISION}'] = s(e['{#SENSOR_PRECISION}']);

                      e['{#VOLT_PRESENT}'] = '0';
                      e['{#VOLT_INDEX}'] = s(e['{#SNMPINDEX}']);
                      e['{#VOLT_SCALE}'] = s(e['{#SENSOR_SCALE}']);
                      e['{#VOLT_PRECISION}'] = s(e['{#SENSOR_PRECISION}']);

                      if (port) {
                          var m = mod(root);
                          var lane = laneNumber(port);
                          var so = sensorObj(e, port);

                          if (type === '6') {
                              var d = direction(rawInfo);
                              if (d === 'RX') m.rx[lane] = so;
                              if (d === 'TX') m.tx[lane] = so;
                          }
                          else if (type === '8' && /DOM|Ethernet/i.test(rawInfo) && sensorValueValid(so.value)) {
                              m.temps.push(so);
                          }
                          else if ((type === '3' || type === '4') && /DOM|Voltage|Ethernet/i.test(rawInfo) && sensorValueValid(so.value)) {
                              m.volts.push(so);
                          }
                          else if (type === '5' && /(Bias|Current)/i.test(rawInfo) && sensorValueValid(so.value)) {
                              if (port.toLowerCase() === root.toLowerCase()) m.biasCommon = so;
                              else m.bias[lane] = so;
                          }
                      }

                      out.push(e);
                  });

                  // Append exactly ONE graph/composite row per physical transceiver.
                  Object.keys(modules).sort().forEach(function(k) {
                      var m = modules[k];
                      var lanes = [];

                      Object.keys(m.rx).forEach(function(x) {
                          var n=Number(x);
                          if (m.tx[n]) lanes.push(n);
                      });
                      lanes.sort(function(a,b){return a-b;});
                      if (!lanes.length) return;

                      // Current Arista platforms in this template expose up to four optical lanes.
                      // Additional lanes remain safely outside this graph and can be extended later.
                      if (lanes.length > 4) lanes = lanes.slice(0,4);

                      var first = m.rx[lanes[0]];
                      var temp = chooseAux(m.root,m.temps);
                      var volt = chooseAux(m.root,m.volts);
                      var inf = findIf(m.root);
                      var moduleLabel = inf.alias ? m.root + '(' + inf.alias + ')' : m.root;
                      var mode = lanes.length === 1 ? 'SINGLE' : 'MULTI';

                      if (!temp) temp = blankSensor(first);
                      if (!volt) volt = blankSensor(first);

                      var row = {
                          '{#SNMPINDEX}': first.index,
                          '{#SENSOR_TYPE}': '6',
                          '{#SENSOR_SCALE}': first.scale,
                          '{#SENSOR_PRECISION}': first.precision,
                          '{#SENSOR_VALUE}': '',
                          '{#SENSOR_STATUS}': '',
                          '{#SENSOR_INFO}': 'Optics module for ' + moduleLabel,
                          '{#THRESHOLD_LO_WARN}': '',
                          '{#THRESHOLD_LO_CRIT}': '',
                          '{#THRESHOLD_HI_WARN}': '',
                          '{#THRESHOLD_HI_CRIT}': '',
                          '{#PORT}': m.root,
                          '{#IFNAME}': inf.name || m.root,
                          '{#IFALIAS}': inf.alias || '',
                          '{#IFLABEL}': moduleLabel,
                          '{#ALIAS_PORT}': inf.name || m.root,
                          '{#SENSOR_DIRECTION}': 'MODULE',
                          '{#ROW_KIND}': 'MODULE',
                          '{#MODULE}': m.root,
                          '{#MODULE_LABEL}': moduleLabel,
                          '{#LANE_COUNT}': String(lanes.length),
                          '{#LANE_MODE}': mode,

                          '{#TEMP_PRESENT}': m.temps.length ? '1' : '0',
                          '{#TEMP_INDEX}': temp.index,
                          '{#TEMP_SCALE}': temp.scale,
                          '{#TEMP_PRECISION}': temp.precision,

                          '{#VOLT_PRESENT}': m.volts.length ? '1' : '0',
                          '{#VOLT_INDEX}': volt.index,
                          '{#VOLT_SCALE}': volt.scale,
                          '{#VOLT_PRECISION}': volt.precision
                      };

                      for (var slot=1; slot<=4; slot++) {
                          var actualLane = lanes[slot-1];
                          var present = actualLane !== undefined;
                          var rx = present ? m.rx[actualLane] : first;
                          var tx = present ? m.tx[actualLane] : m.tx[lanes[0]];
                          var b = null;

                          if (present && m.bias[actualLane]) b = m.bias[actualLane];
                          else if (slot === 1 && m.biasCommon) b = m.biasCommon;
                          if (!b) b = first;

                          row['{#LANE'+slot+'_NUM}'] = present ? String(actualLane) : String(slot);
                          row['{#LANE'+slot+'_DISPLAY}'] =
                              (mode === 'SINGLE' && slot === 1) ? 'signal' :
                              ('lane ' + (present ? actualLane : slot));

                          row['{#RX'+slot+'_PRESENT}'] = present ? '1' : '0';
                          row['{#RX'+slot+'_INDEX}'] = rx.index;
                          row['{#RX'+slot+'_SCALE}'] = rx.scale;
                          row['{#RX'+slot+'_PRECISION}'] = rx.precision;

                          row['{#TX'+slot+'_PRESENT}'] = present ? '1' : '0';
                          row['{#TX'+slot+'_INDEX}'] = tx.index;
                          row['{#TX'+slot+'_SCALE}'] = tx.scale;
                          row['{#TX'+slot+'_PRECISION}'] = tx.precision;

                          var biasPresent = false;
                          if (present && m.bias[actualLane]) biasPresent = true;
                          if (slot === 1 && m.biasCommon) biasPresent = true;

                          row['{#BIAS'+slot+'_PRESENT}'] = biasPresent ? '1' : '0';
                          row['{#BIAS'+slot+'_INDEX}'] = b.index;
                          row['{#BIAS'+slot+'_SCALE}'] = b.scale;
                          row['{#BIAS'+slot+'_PRECISION}'] = b.precision;
                      }

                      out.push(row);
                  });

                  return JSON.stringify(out);
          overrides:
