                          e['{#IFNAME}']=ifname;
                          e['{#IFALIAS}']=alias;
                          e['{#IFLABEL}']=label;
                          e['{#ALIAS_PORT}']=ifname;
                          e['{#SENSOR_INFO}']=info.replace(port,label);
