                      var p = idx.split('.');
                      var ifindex = p[0];
                      if (!ifindex) return;

                      if (Object.prototype.hasOwnProperty.call(e, '{#IFNAME}')) {
                          var name = s(e['{#IFNAME}']);
                          if (name) {
                              if (!ifs[ifindex]) ifs[ifindex] = {name:name, alias:''};
