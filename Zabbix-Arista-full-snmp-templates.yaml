                      var pm = info.match(/Ethernet\d+(?:\/\d+)?/i);
                      if (pm) {
                          var port = pm[0];
                          var candidates=[port];
                          var lm=port.match(/^(Ethernet\d+)\/(\d+)$/i);
                          if (lm) {
